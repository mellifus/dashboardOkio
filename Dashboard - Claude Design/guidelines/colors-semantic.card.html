<!-- @dsCard group="Colors" viewport="700x180" name="Semantic" subtitle="Warning, danger, success — request categories & risk flags" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans)}</style></head>
<body>
<div style="display:flex;height:100%">
  <div style="flex:1;background:var(--warning);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:white">warning</div>
  <div style="flex:1;background:var(--warning-bg);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--warning-text)">warning-bg</div>
  <div style="flex:1;background:var(--danger);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:white">danger</div>
  <div style="flex:1;background:var(--danger-bg);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:var(--danger-text)">danger-bg</div>
  <div style="flex:1;background:var(--success);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:white">success</div>
  <div style="flex:1;background:var(--info);display:flex;align-items:flex-end;padding:6px;font-size:10px;color:white">info</div>
</div>
</body></html>
