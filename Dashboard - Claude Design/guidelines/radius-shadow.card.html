<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);padding:18px;display:flex;gap:16px;color:var(--text-primary)}
.box{width:100px;height:100px;background:white;border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center}
</style></head>
<body>
<div class="box" style="border-radius:6px">radius-sm 6px<br/>(button/pill)</div>
<div class="box" style="border-radius:12px;box-shadow:var(--shadow-card)">radius-3xl 12px<br/>+ shadow-card<br/>(panels)</div>
<div class="box" style="border-radius:50%">radius-full<br/>(avatar/dot)</div>
</body></html>
