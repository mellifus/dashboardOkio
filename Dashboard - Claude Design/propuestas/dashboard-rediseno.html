<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Okio</title>
<!-- Maqueta estática de la propuesta en Docs/15_Rediseno_Dashboard.md. Datos ficticios. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600;700&display=swap">
<script>
// Tema: si la persona ya eligió en este switch, se respeta. Si no, no se toca nada
// y manda el tema del sistema (o el que fije el visor), vía CSS.
(function(){
  try { var t = localStorage.getItem('okio-tema'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
})();
function temaActual(){
  return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function cambiarTema(){
  var t = temaActual() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.getElementById('tema').setAttribute('aria-checked', t === 'dark');
  try { localStorage.setItem('okio-tema', t); } catch(e) {}
}
addEventListener('DOMContentLoaded', function(){
  document.getElementById('tema').setAttribute('aria-checked', temaActual() === 'dark');
});
</script>
<style>
/* Tokens por tema. Claro = institucional Okio. Oscuro = "verde noche": fondos verdosos, no negro neutro. */
:root{
  --green:#003F36; --gold:#B99269; --gold-light:#C9A583;
  --page:#F8F6F3; --surface:#FFFDFB; --line:#E8E3DD; --sidebar:#002A24;
  --text:#3A3A3A; --muted:#6B6B6B; --gold-text:#8A6A45; --gold-big:#9A7550;
  --accent:#003F36; --solid-bg:#003F36; --solid-text:#FFFFFF;
  --ok:#003F36; --ok-bg:#E3ECE9; --ok-text:#003F36;
  --pend:#9A7550; --pend-bg:#F4EADF; --pend-text:#6B4F33;
  --alert:#8E5A5F; --alert-bg:#F2E4E3; --alert-text:#5D3A33; --alert-line:#E6CFCD; --why:#5A5A5A;
  --ic-text:#FFFFFF;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  color-scheme:light;
}
/* Mismos valores oscuros dos veces: por el sistema (si nadie eligió claro) y por el switch. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0E1614; --surface:#15201D; --line:#26332F; --sidebar:#08110F;
    --text:#E9E4DD; --muted:#A49D94; --gold-text:#D4B48C; --gold-big:#CFAE84;
    --accent:#B5CFC6; --solid-bg:#E9E4DD; --solid-text:#002A24;
    --ok:#6FA394; --ok-bg:#1C2E29; --ok-text:#CFE3DC;
    --pend:#C9A583; --pend-bg:#2E271D; --pend-text:#EBD5B5;
    --alert:#C08A8F; --alert-bg:#2F2023; --alert-text:#F0CFD1; --alert-line:#4A3236; --why:#C9C1BA;
    --ic-text:#15201D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0E1614; --surface:#15201D; --line:#26332F; --sidebar:#08110F;
  --text:#E9E4DD; --muted:#A49D94; --gold-text:#D4B48C; --gold-big:#CFAE84;
  --accent:#B5CFC6; --solid-bg:#E9E4DD; --solid-text:#002A24;
  --ok:#6FA394; --ok-bg:#1C2E29; --ok-text:#CFE3DC;
  --pend:#C9A583; --pend-bg:#2E271D; --pend-text:#EBD5B5;
  --alert:#C08A8F; --alert-bg:#2F2023; --alert-text:#F0CFD1; --alert-line:#4A3236; --why:#C9C1BA;
  --ic-text:#15201D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100dvh}
.sidebar{background:var(--sidebar);color:rgba(235,233,232,.72);padding:22px 14px;display:flex;flex-direction:column}
/* Switch de tema, al pie de la barra */
.theme{margin-top:auto;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:transparent;color:inherit;font:500 14px var(--sans);cursor:pointer;border-radius:8px;text-align:left}
.theme:hover{background:rgba(255,255,255,.06)}
.theme .track{margin-left:auto;width:32px;height:18px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none}
.theme .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--gold-light);transition:transform .2s}
.theme[aria-checked="true"] .track{background:var(--gold)}
.theme[aria-checked="true"] .track::after{transform:translateX(14px);background:#fff}
@media (prefers-reduced-motion:reduce){.theme .track::after{transition:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 26px}
.brand b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--gold);display:block;line-height:1}
.brand small{font-size:8.5px;letter-spacing:.24em;color:var(--gold-light);font-weight:600}
nav a{display:block;padding:10px 12px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500;font-size:15px}
nav a.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
nav a{display:flex;align-items:center} nav .count{margin-left:auto;background:var(--gold);color:var(--green);font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
main{padding:24px 28px;min-width:0}
header{display:flex;align-items:end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 4px}
h1{font-family:var(--serif);font-weight:400;font-size:32px;margin:0;letter-spacing:-.01em}
h1 em{color:var(--gold-big)} /* #B99269 da 2.5:1 sobre crema; este pasa 3:1 para texto grande */
.switch{margin-left:auto;display:flex;gap:6px}
.pill{font:600 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:10px 18px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.pill.solid{background:var(--solid-bg);border-color:var(--solid-bg);color:var(--solid-text)}
.pill.sm{padding:7px 14px;font-size:12px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg button{font:600 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:999px;padding:8px 18px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ok-bg);color:var(--ok-text)}

/* Requiere atención */
.attn{background:var(--alert-bg);border:1px solid var(--alert-line);border-left:3px solid var(--alert);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.attn h2{font:600 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--alert);margin:0 0 6px}
.attn-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--alert-line)}
.attn-row:first-of-type{border-top:0}
.attn-row time{font-variant-numeric:tabular-nums;font-weight:600}
.attn-row .why{display:block;color:var(--why);font-size:13.5px} /* sobre el fondo rosado, --muted no alcanza 4.5:1 */
.side{display:grid;gap:14px}
.side .attn{margin:0}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* Calendario: filas por hora y una columna por profesional (en Semana, por día y profesional).
   Escala fija: 64 px por hora. El corte 13–15 es una franja angosta, no dos horas vacías. */
.cal{overflow:auto;max-height:calc(100dvh - 150px);overscroll-behavior:contain}
.cal-top{position:sticky;top:0;z-index:3;display:grid;background:var(--surface);border-bottom:1px solid var(--line)}
.cal-dia{padding:12px 8px 2px;text-align:center;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line)}
.cal-dia b{font:400 22px var(--serif);letter-spacing:0;color:var(--text);margin-left:4px}
.cal-dia.hoy{color:var(--gold-text)} .cal-dia.hoy b{color:var(--gold-big)}
.cal-dia.click{cursor:pointer} .cal-dia.click:hover{background:var(--page)}
.cal-pro{padding:10px 8px;text-align:center;font:400 18px var(--serif)}
.cal-pro.chico{font:500 13.5px var(--sans);color:var(--muted);padding:2px 8px 8px}
#vista-semana .cal-pro.first{border-left:1px solid var(--line)}
.cal-pro small{display:block;font:13px var(--sans);color:var(--muted)}
.cal-body{position:relative;display:grid}
.cal-horas{position:relative}
.cal-horas span{position:absolute;right:10px;transform:translateY(-50%);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-horas span:first-child{transform:none;margin-top:2px}
.cal-horas .now-l{background:var(--text);color:var(--page);font-weight:600;padding:1px 6px;border-radius:999px;z-index:2}
.hl{position:absolute;z-index:1;left:64px;right:0;border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent);pointer-events:none}
.cal-cerrado{position:absolute;left:64px;right:0;display:flex;align-items:center;justify-content:center;background:var(--page);color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;pointer-events:none;z-index:1}
.cal-cerrado span{padding:1px 10px;border-radius:999px}
.col{position:relative;cursor:pointer}
.col:hover{background:color-mix(in srgb,var(--page) 70%,transparent)}
#vista-semana .col.first{border-left:1px solid var(--line)} /* en Semana, solo se separan los días */
.now{position:absolute;left:0;right:0;border-top:2px solid var(--text);z-index:2;pointer-events:none}

/* Turno: alto = duración. Línea 1: ícono de estado (si no está confirmado) + clienta. Línea 2: horario · tratamiento. */
.ev{position:absolute;left:4px;right:4px;z-index:1;display:flex;flex-direction:column;gap:1px;overflow:hidden;padding:5px 9px;border:0;border-left:3px solid;border-radius:8px;font:inherit;font-size:13.5px;line-height:1.3;text-align:left;cursor:pointer;transition:filter .15s}
.ev:hover{filter:brightness(.96)}
.ev>b,.ev>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev b{font-weight:600;font-size:14.5px}
.ev .ic{margin-right:5px;vertical-align:-2px}
.ev.short{flex-direction:row;align-items:center;gap:8px}
.ev.short>span{flex:1;min-width:0}
.ev.sel{outline:2px solid var(--text);outline-offset:1px;z-index:2}
#cal-dia .ev{padding:7px 12px} #cal-dia .ev b{font-size:16px} #cal-dia .ev>span{font-size:14.5px}
#cal-dia .ev.short{padding:4px 12px}
.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-text)}
.pend{background:var(--pend-bg);border-color:var(--pend);color:var(--pend-text)}
.alert{background:var(--alert-bg);border-color:var(--alert);color:var(--alert-text)}
.past{background:var(--page);border-color:var(--line);color:var(--muted)}
.ic{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:11px;font-weight:700;color:var(--ic-text);flex:none;align-self:center}
.alert .ic{background:var(--alert)} .pend .ic{background:var(--pend)}
#vista-semana .ev.short>span{display:none} /* en Semana, los turnos cortos muestran solo la clienta */

/* Detalle */
.detail{padding:20px}
.detail h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:4px 0 2px}
.detail .when{color:var(--muted);font-variant-numeric:tabular-nums;margin:0 0 14px}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.detail ul{margin:6px 0 16px;padding-left:18px}
.detail dl{margin:0 0 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}
.detail dt{color:var(--muted)}
.detail dd{margin:0}
.legend{display:flex;gap:16px;font-size:13.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{font-size:13px;color:var(--muted);margin-top:14px}

/* Clientes y Mensajes: lista a la izquierda, detalle a la derecha */
.two{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.list{padding:8px}
.search{width:100%;padding:9px 14px;margin-bottom:6px;border:1px solid var(--line);border-radius:999px;background:var(--page);color:var(--text);font:15px var(--sans)}
.search::placeholder{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--page)}
.row.on{background:var(--page);box-shadow:inset 3px 0 0 var(--text)}
.row .who{flex:1;min-width:0}
.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread b{font-weight:700} .row.unread small{color:var(--text)}
.row time{align-self:flex-start;margin-top:2px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ic-alert{background:var(--alert)} .ic-pend{background:var(--pend)}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}

.ficha{padding:24px}
.ficha h2{font:400 30px var(--serif);letter-spacing:-.01em;margin:4px 0 2px}
.meta{color:var(--muted);margin:0 0 6px;font-variant-numeric:tabular-nums}
.block{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:12px}
.plain{margin:0 0 12px}
.next{display:flex;align-items:center;gap:12px;padding:12px 14px;border-left:3px solid;border-radius:10px}
.next strong,.next span:not(.ic){display:block}
.next span:not(.ic){font-size:14px;margin-top:2px}

.chat{display:flex;flex-direction:column}
.linked{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:14.5px}
.thread{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.day{align-self:center;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.msg{max-width:72%;margin:0;padding:9px 13px;border-radius:14px;font-size:15px;line-height:1.45}
.msg small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.msg.in{align-self:flex-start;background:var(--page);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--ok-bg);color:var(--ok-text);border-bottom-right-radius:4px}
.msg.out small{color:inherit;opacity:.75}
.draft{margin:0 20px 14px;padding:12px 14px;border:1px dashed var(--gold-light);border-radius:14px}
.draft label{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text)}
.draft textarea{width:100%;margin:6px 0 8px;border:0;background:transparent;color:var(--text);font:15px/1.5 var(--sans);resize:vertical}
.draft textarea:focus-visible{outline:none}
.draft:focus-within{border-style:solid;border-color:var(--gold)}
.reply{border-style:solid;border-color:var(--line)} .reply label{color:var(--muted)} .reply:focus-within{border-color:var(--text)}
.draft textarea::placeholder{color:var(--muted)}
.act{display:flex;align-items:center;gap:8px}
.act small{margin-right:auto;font-size:13px;color:var(--muted)}
.fine{margin:0 20px 18px;font-size:13px;color:var(--muted)}
.notice{margin:0 20px 14px;flex-wrap:wrap}
.notice .ic{align-self:flex-start;margin-top:2px}
.notice .grow{flex:1 1 calc(100% - 40px)} /* el texto ocupa la línea entera; los botones pasan abajo */
.notice .pill:first-of-type{margin-left:26px}
.done{color:var(--ok-text);font-weight:600}

/* Aviso flotante para lo que la demo todavía no hace */
.aviso{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--solid-bg);color:var(--solid-text);font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.18)}

@media (max-width:900px){
  .two{grid-template-columns:1fr}
  /* En pantallas angostas la barra lateral pasa a ser una barra arriba, con menú y switch */
  .app{grid-template-columns:1fr}
  .sidebar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 16px}
  .brand{padding:0 6px 0 0}
  .sidebar nav{display:flex;gap:2px}
  .theme{margin:0 0 0 auto}
  main{padding:16px}
  .layout{grid-template-columns:minmax(0,1fr)}
}
/* Celular: "Requiere atención" primero */
@media (max-width:640px){
  .side{display:contents}
  .side .attn{order:-1}
}
</style>
</head>
<body>
<div class="aviso" id="aviso" role="status" hidden></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="20" viewBox="0 0 100 78" fill="none" stroke="#B99269" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M50 8C57 24 57 42 50 56C43 42 43 24 50 8Z"/><path d="M50 56C41 49 34 38 34 24C43 30 49 43 50 56Z"/><path d="M50 56C59 49 66 38 66 24C57 30 51 43 50 56Z"/><path d="M50 58C37 57 23 50 16 39C31 38 45 46 50 58Z"/><path d="M50 58C63 57 77 50 84 39C69 38 55 46 50 58Z"/></svg>
      <div><b>Okio</b><small>ESTÉTICA Y BIENESTAR</small></div>
    </div>
    <nav>
      <a class="on" href="#" id="nav-agenda" onclick="ir('agenda');return false">Agenda<span class="count" title="2 turnos requieren atención hoy">2</span></a>
      <a href="#" id="nav-clientes" onclick="ir('clientes');return false">Clientes</a>
      <a href="#" id="nav-mensajes" onclick="ir('mensajes');return false">Mensajes<span class="count" title="1 mensaje sin leer">1</span></a>
    </nav>
    <button class="theme" id="tema" role="switch" aria-checked="false" onclick="cambiarTema()">Modo oscuro<span class="track" aria-hidden="true"></span></button>
  </aside>

  <main>
    <section id="pantalla-agenda">
    <header>
      <div>
        <p class="eyebrow" id="eyebrow">Agenda · Día</p>
        <h1 id="titulo">Jueves <em>17</em> de septiembre</h1>
      </div>
      <div class="switch">
        <div class="seg" role="group" aria-label="Vista"><button class="on" id="btn-dia" aria-pressed="true" onclick="ver('dia')">Día</button>
        <button id="btn-semana" aria-pressed="false" onclick="ver('semana')">Semana</button></div>
        <button class="pill solid" style="margin-left:10px" onclick="aviso('Cargar turnos nuevos todavía no está en la demo.')">+ Turno</button>
      </div>
    </header>

    <div id="vista-dia">
    <div class="layout">
      <!-- Calendario del día: una columna por profesional, bloques del alto de su duración.
           Click en un horario libre = turno nuevo. Maqueta: hora fija 15:20. -->
      <section class="card cal" id="cal-dia" aria-label="Agenda del día"></section>

      <div class="side">
      <section class="attn" id="attn" aria-label="Requiere atención"></section>
      <aside class="card detail" id="detalle" aria-live="polite"></aside>
      </div>
    </div>

    </div>

    <!-- Semana: el mismo calendario, lunes a viernes, una subcolumna por profesional dentro de cada día. -->
    <section id="vista-semana" class="card cal" aria-label="Agenda de la semana" hidden></section>

    <div class="legend">
      <span><i style="background:var(--ok)"></i>Confirmado</span>
      <span><i style="background:var(--gold)"></i>Sin confirmar</span>
      <span><i style="background:var(--alert)"></i>Requiere atención</span>
      <span><i style="background:var(--line)"></i>Ya pasó</span>
      <span>Click en un horario libre para agendar</span>
      <span>Datos ficticios · logo provisorio</span>
    </div>
    </section>

    <!-- Clientes: la lista responde "quién es?"; la ficha, "quién es y cuándo vuelve?". Lo clínico queda detrás de un acceso restringido. -->
    <section id="pantalla-clientes" hidden>
      <header>
        <div>
          <p class="eyebrow">Clientes · 7 fichas</p>
          <h1>Clientes</h1>
        </div>
        <div class="switch"><button class="pill solid" onclick="aviso('Cargar clientas nuevas todavía no está en la demo.')">+ Clienta</button></div>
      </header>
      <div class="two">
        <section class="card list" aria-label="Lista de clientas">
          <input class="search" id="buscar" type="search" oninput="filtrarClientas(this.value)" placeholder="Buscar por nombre o teléfono" aria-label="Buscar clienta">
          <div id="lista-clientas"></div>
        </section>

        <!-- Se arma desde CLIENTAS (script al final) -->
        <section class="card ficha" id="ficha" aria-live="polite"></section>
      </div>
    </section>

function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// Turnos de hoy. Estado y tratamientos salen de CLIENTAS; rec = cómo va el recordatorio.

  {c:'Florencia Díaz',   pro:'Eliana', ini:'17:30', fin:'18:10', rec:'Enviado ayer · confirmó'}
];
var AHORA = '15:20', turnoSel = 4; // Luciana, la del recorrido de la demo

function minutos(h){ var x = h.split(':'); return +x[0] * 60 + +x[1]; }
function turnoDe(nombre){ for (var i = 0; i < HOY.length; i++) if (HOY[i].c === nombre) return i; return -1; }
function convDe(nombre){ for (var i = 0; i < CONVERSACIONES.length; i++) if (CONVERSACIONES[i].nombre === nombre) return i; return -1; }

function turnosDe(d, pro){
  if (d === HOY_D) return HOY.map(function(t, i){
    var p = clientaDe(t.c).prox;
    return {pro:t.pro, ini:t.ini, fin:t.fin, c:t.c, tx:p.tx, estado:p.estado, i:i};
  }).filter(function(t){ return t.pro === pro; });
  return OTROS.filter(function(t){ return t.d === d && t.pro === pro; });
}

function bloque(t, semana){
  var a = minutos(t.ini), b = minutos(t.fin), estado = t.estado === 'past' ? 'Ya pasó' : ESTADOS[t.estado].texto;
  var accion = t.i != null ? 'ver(\'dia\');elegirTurno(' + t.i + ')' : 'aviso(\'La demo solo tiene el detalle de hoy, jueves 17.\')';
  return '<button class="ev ' + t.estado + (b - a < 50 ? ' short' : '') + (!semana && t.i === turnoSel ? ' sel' : '') + '"' +
    ' style="top:' + (y(a) + 1) + 'px;height:' + (y(b) - y(a) - 2) + 'px" onclick="' + accion + '"' +
    ' aria-label="' + t.c + ', ' + t.ini + ' a ' + t.fin + ', ' + t.tx + ', con ' + t.pro + '. ' + estado + '">' +
    '<b>' + (t.estado === 'past' ? '' : icono(t.estado)) + (semana ? corto(t.c) : t.c) + '</b>' +
    '<span>' + t.ini + '–' + t.fin + ' · ' + t.tx + '</span></button>';
}

// Un solo calendario para Día (un día) y Semana (cinco días): columnas = días × profesionales.
function pintarCal(id, dias){
  var semana = dias.length > 1, ahora = minutos(AHORA);
  var cols = 'grid-template-columns:64px repeat(' + dias.length * PROS.length + ',minmax(' + (semana ? 92 : 0) + 'px,1fr))';
  var top = '<div class="cal-top" style="' + cols + '"><div></div>';
  if (semana) top += dias.map(function(d){
    var x = DIAS[d];
    return '<div class="cal-dia' + (x.hoy ? ' hoy click" onclick="ver(\'dia\')" title="Abrir el día' : '') + '" style="grid-column:span ' + PROS.length + '">' +
      x.d + '<b>' + x.n + '</b>' + (x.hoy ? ' · hoy' : '') + '</div>';
  }).join('') + '<div></div>';
  var body = '<div class="cal-body" style="' + cols + ';height:' + y(1200) + 'px"><div class="cal-horas">';
  for (var h = 9; h <= 20; h++) if (h <= 13 || h >= 15) body += '<span style="top:' + y(h * 60) + 'px">' + hhmm(h * 60) + '</span>';
  if (dias.indexOf(HOY_D) >= 0) body += '<span class="now-l" style="top:' + y(ahora) + 'px">' + AHORA + '</span>';
  body += '</div>';
  for (var m = 600; m < 1200; m += 60) if (m <= 780 || m > 900) body += '<i class="hl" style="top:' + y(m) + 'px"></i>';
  body += '<div class="cal-cerrado" style="top:' + y(780) + 'px;height:' + CORTE + 'px"><span>Cerrado 13–15</span></div>';
  dias.forEach(function(d){
    PROS.forEach(function(p, j){
      var turnos = turnosDe(d, p);
      top += '<div class="cal-pro' + (semana ? ' chico' : '') + (j === 0 ? ' first' : '') + '">' + p + (semana ? '' : '<small>' + turnos.length + ' turnos</small>') + '</div>';
      body += '<div class="col' + (j === 0 ? ' first' : '') + '" data-d="' + d + '" data-pro="' + p + '" onclick="nuevoEn(event,this)" title="Click en un horario libre para agendar con ' + p + '">' +
        turnos.map(function(t){ return bloque(t, semana); }).join('') +
        (DIAS[d].hoy ? '<div class="now" style="top:' + y(ahora) + 'px"></div>' : '') + '</div>';
    });
  });
  document.getElementById(id).innerHTML = top + '</div>' + body + '</div>';
}

// Click en un hueco del calendario: arma el turno nuevo con profesional, día y hora (redondeada a la media hora).
function nuevoEn(e, col){
  if (e.target !== col) return;
  var m = Math.floor(minDeY(e.offsetY) / 30) * 30;
  if (m >= 780 && m < 900) return;
  aviso('Turno nuevo con ' + col.dataset.pro + ', ' + DIAS[+col.dataset.d].largo + ' a las ' + hhmm(m) + '. Cargar turnos todavía no está en la demo.');
}

function pintarAtencion(){
  var filas = HOY.map(function(t, i){
    var e = clientaDe(t.c).prox.estado;
    if (e === 'ok') return '';
    var boton = e === 'alert'
      ? '<button class="pill sm" onclick="responder(\'' + t.c + '\')">Responder</button>'
      : (t.enviado ? '' : '<button class="pill sm solid" onclick="prepararRecordatorio(' + i + ')">Recordatorio</button>');
    var why = e === 'alert' ? 'Avisó que no puede venir' : (t.enviado ? t.rec : 'Sin confirmar');
    return '<div class="attn-row"><time>' + t.ini + '</time><div><strong>' + t.c + '</strong><span class="why">' + why + '</span></div>' + boton + '</div>';
  }).filter(Boolean);
  document.getElementById('attn').innerHTML = '<h2>Requiere atención hoy · ' + filas.length + '</h2>' + filas.join('');
}

function elegirTurno(i){
  turnoSel = i;
  var t = HOY[i], c = clientaDe(t.c), p = c.prox, dur = minutos(t.fin) - minutos(t.ini), k = convDe(t.c);
  var principal = '';
  if (p.estado === 'pend' && !t.enviado) principal = '<button class="pill solid" style="width:100%" onclick="prepararRecordatorio(' + i + ')">Preparar recordatorio</button>';
  else if (k >= 0) principal = '<button class="pill solid" style="width:100%" onclick="ir(\'mensajes\');elegirConversacion(' + k + ')">Ver conversación</button>';
  document.getElementById('detalle').innerHTML =
    '<p class="eyebrow">Turno seleccionado</p>' +
    '<h2>' + t.c + '</h2>' +
    '<p class="when">' + t.ini + ' – ' + t.fin + ' · ' + dur + ' min</p>' +
    '<span class="badge ' + p.estado + '">' + ESTADOS[p.estado].texto + '</span>' +
    '<p class="eyebrow" style="margin-top:18px">Tratamientos</p>' +
    '<ul>' + p.tx.split(' + ').map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>' +
    '<dl><dt>Profesional</dt><dd>' + t.pro + '</dd>' +
    '<dt>WhatsApp</dt><dd>+54 351 ' + c.tel + '</dd>' +
    '<dt>Recordatorio</dt><dd>' + t.rec + '</dd></dl>' +
    principal +
    '<button class="pill" style="width:100%;margin-top:8px" onclick="verFicha(\'' + t.c + '\')">Ver ficha</button>';
  pintarCal('cal-dia', [HOY_D]);
}

function verEnAgenda(nombre){ ir('agenda'); ver('dia'); var i = turnoDe(nombre); if (i >= 0) elegirTurno(i); }
function verFicha(nombre){ ir('clientes'); elegirClienta(CLIENTAS.indexOf(clientaDe(nombre))); }
// Avisos de "no puedo ir": los responde recepción por WhatsApp, desde el chat de la clienta.
function responder(nombre){
  ir('mensajes'); elegirConversacion(convDe(nombre));
  var ta = document.getElementById('respuesta'); if (ta) ta.focus();
}
function enviarRespuesta(k){
  var conv = CONVERSACIONES[k], texto = document.getElementById('respuesta').value.trim();
  if (!texto) { aviso('Escribí el mensaje antes de enviar.'); return; }
  conv.mensajes.push({de:'out', texto:texto, hora:'Okio · 15:21'});
  conv.cierre = 'respondido'; conv.resumen = 'Respondido · esperando que elija otro horario';
  elegirConversacion(k);
}

function filtrarClientas(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('#lista-clientas .row').forEach(function(r, j){
    r.hidden = !!q && (CLIENTAS[j].nombre + ' ' + CLIENTAS[j].tel).toLowerCase().indexOf(q) < 0;
  });
}

var avisoTimer;
function aviso(texto){
  var el = document.getElementById('aviso');
  el.textContent = texto; el.hidden = false;
  clearTimeout(avisoTimer); avisoTimer = setTimeout(function(){ el.hidden = true; }, 3500);
}

// Recordatorio: lo redacta la IA real (ai-triage/server.mjs → /api/recordatorio).
// Si no hay servidor, falta la key o tarda más de 15 s, queda un borrador de ejemplo y la demo sigue.
async function prepararRecordatorio(i){
  if (i == null) i = turnoSel;
  var t = HOY[i], p = clientaDe(t.c).prox, nombre = t.c.split(' ')[0], k = convDe(t.c);
  var tratamiento = p.tx.toLowerCase().replace(' + ', ' y ');
  if (k < 0) {
    CONVERSACIONES.push({nombre:t.c, hora:'15:21', mensajes:[]});
    k = CONVERSACIONES.length - 1;
  }
  var conv = CONVERSACIONES[k];
  conv.cierre = 'borrador'; conv.resumen = 'Borrador listo para revisar';
  conv.borrador = conv.borrador || ('Hola ' + nombre + '! Te recordamos tu turno de hoy, jueves 17, a las ' + t.ini +
    ' con ' + t.pro + ': ' + tratamiento + '. Nos confirmás si venís? Saludos!');
  ir('mensajes'); elegirConversacion(k);
  var ta = document.getElementById('borrador'), label = document.getElementById('borrador-label'), btn = document.getElementById('btn-aprobar');
  ta.value = 'Redactando con IA…'; ta.disabled = true; btn.disabled = true;
  try {
    var r = await fetch('/api/recordatorio', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      signal: AbortSignal.timeout(15000),
      body: JSON.stringify({turnos: [{nombre: nombre, tratamiento: tratamiento, dia: 'hoy, jueves 17', hora: t.ini, profesional: t.pro}]})
    });
    var data = await r.json();
    if (!r.ok) throw new Error(data.error);
    conv.borrador = data.items[0].mensaje;
    label.textContent = 'Borrador redactado por la IA · Revisalo antes de enviar';
  } catch (e) {
    console.warn('Sin IA, queda el borrador de ejemplo:', e);
    label.textContent = 'Borrador de ejemplo · Revisalo antes de enviar';
  }
  ta.value = conv.borrador; ta.disabled = false; btn.disabled = false;
}

function aprobar(k){
  var conv = CONVERSACIONES[k], t = HOY[turnoDe(conv.nombre)];
  conv.mensajes.push({dia:'Hoy'}, {de:'out', texto: document.getElementById('borrador').value, hora:'Okio · 15:21'});
  conv.cierre = 'enviado'; conv.resumen = 'Recordatorio enviado · esperando respuesta';
  elegirConversacion(k);
  if (t) { t.enviado = true; t.rec = 'Enviado hoy 15:21 · esperando respuesta'; }
  pintarAtencion(); elegirTurno(turnoSel);
}

pintarListaMensajes(-1);
elegirConversacion(1); // Luciana, la del recorrido de la demo
pintarAtencion();
elegirTurno(turnoSel);

function ir(p){
  ['agenda','clientes','mensajes'].forEach(function(x){
    document.getElementById('pantalla-' + x).hidden = x !== p;
    document.getElementById('nav-' + x).classList.toggle('on', x === p);
    if (x === p) document.getElementById('nav-' + x).setAttribute('aria-current', 'page');
    else document.getElementById('nav-' + x).removeAttribute('aria-current');
  });
}

function ver(v){
  var dia = v === 'dia';
  document.getElementById('vista-dia').hidden = !dia;
  document.getElementById('vista-semana').hidden = dia;
  document.getElementById('btn-dia').classList.toggle('on', dia); document.getElementById('btn-dia').setAttribute('aria-pressed', dia);
  document.getElementById('btn-semana').classList.toggle('on', !dia); document.getElementById('btn-semana').setAttribute('aria-pressed', !dia);
  document.getElementById('eyebrow').textContent = dia ? 'Agenda · Día' : 'Agenda · Semana';
  document.getElementById('titulo').innerHTML = dia ? 'Jueves <em>17</em> de septiembre' : 'Semana del <em>14</em> al 18 de septiembre';
  if (!dia) pintarCal('vista-semana', [0, 1, 2, 3, 4]);
  var cal = document.getElementById(dia ? 'cal-dia' : 'vista-semana');
  cal.scrollTop = Math.max(0, y(minutos(AHORA)) - 180); // arranca mostrando la hora actual
}
ver('dia');
</script>
