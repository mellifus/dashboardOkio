<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Okio</title>
<!-- Maqueta estática de la propuesta en Docs/15_Rediseno_Dashboard.md. Datos ficticios. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600;700&display=swap">
<script>
// Tema: si la persona ya eligió en este switch, se respeta. Si no, no se toca nada
// y manda el tema del sistema (o el que fije el visor), vía CSS.
(function(){
  try { var t = localStorage.getItem('okio-tema'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
})();
function temaActual(){
  return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function cambiarTema(){
  var t = temaActual() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.getElementById('tema').setAttribute('aria-checked', t === 'dark');
  try { localStorage.setItem('okio-tema', t); } catch(e) {}
}
addEventListener('DOMContentLoaded', function(){
  document.getElementById('tema').setAttribute('aria-checked', temaActual() === 'dark');
});
</script>
<style>
/* Tokens por tema. Claro = institucional Okio. Oscuro = "verde noche": fondos verdosos, no negro neutro. */
:root{
  --green:#003F36; --gold:#B99269; --gold-light:#C9A583;
  --page:#F8F6F3; --surface:#FFFDFB; --line:#E8E3DD; --sidebar:#002A24;
  --text:#3A3A3A; --muted:#6B6B6B; --gold-text:#8A6A45; --gold-big:#9A7550;
  --accent:#003F36; --solid-bg:#003F36; --solid-text:#FFFFFF;
  --ok:#003F36; --ok-bg:#E3ECE9; --ok-text:#003F36;
  --pend:#9A7550; --pend-bg:#F4EADF; --pend-text:#6B4F33;
  --alert:#8E5A5F; --alert-bg:#F2E4E3; --alert-text:#5D3A33; --alert-line:#E6CFCD; --why:#5A5A5A;
  --ic-text:#FFFFFF; --done-bg:#ECE7E2;
  --wk-ok-line:#C9DAD5; --wk-past-bg:#F1ECE8; --wk-past-line:#E6DED9; --today-head:#F8F5F1; --today-col:#FBF8F4; --hour-line:#EEE6E1;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  color-scheme:light;
}
/* Mismos valores oscuros dos veces: por el sistema (si nadie eligió claro) y por el switch. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0E1614; --surface:#15201D; --line:#26332F; --sidebar:#08110F;
    --text:#E9E4DD; --muted:#A49D94; --gold-text:#D4B48C; --gold-big:#CFAE84;
    --accent:#B5CFC6; --solid-bg:#E9E4DD; --solid-text:#002A24;
    --ok:#6FA394; --ok-bg:#1C2E29; --ok-text:#CFE3DC;
    --pend:#C9A583; --pend-bg:#2E271D; --pend-text:#EBD5B5;
    --alert:#C08A8F; --alert-bg:#2F2023; --alert-text:#F0CFD1; --alert-line:#4A3236; --why:#C9C1BA;
    --ic-text:#15201D; --done-bg:#1F2A27;
  --wk-ok-line:#2E4A42; --wk-past-bg:#1A2421; --wk-past-line:#26332F; --today-head:#1B2925; --today-col:#18241F; --hour-line:#1F2B28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0E1614; --surface:#15201D; --line:#26332F; --sidebar:#08110F;
  --text:#E9E4DD; --muted:#A49D94; --gold-text:#D4B48C; --gold-big:#CFAE84;
  --accent:#B5CFC6; --solid-bg:#E9E4DD; --solid-text:#002A24;
  --ok:#6FA394; --ok-bg:#1C2E29; --ok-text:#CFE3DC;
  --pend:#C9A583; --pend-bg:#2E271D; --pend-text:#EBD5B5;
  --alert:#C08A8F; --alert-bg:#2F2023; --alert-text:#F0CFD1; --alert-line:#4A3236; --why:#C9C1BA;
  --ic-text:#15201D; --done-bg:#1F2A27;
  --wk-ok-line:#2E4A42; --wk-past-bg:#1A2421; --wk-past-line:#26332F; --today-head:#1B2925; --today-col:#18241F; --hour-line:#1F2B28;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--sans);font-size:16.5px;line-height:1.45}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100dvh}
.sidebar{background:var(--sidebar);color:rgba(235,233,232,.72);padding:22px 14px;display:flex;flex-direction:column}
/* Switch de tema, al pie de la barra */
.theme{margin-top:auto;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:transparent;color:inherit;font:500 15.5px var(--sans);cursor:pointer;border-radius:8px;text-align:left}
.theme:hover{background:rgba(255,255,255,.06)}
.theme .track{margin-left:auto;width:32px;height:18px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none}
.theme .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--gold-light);transition:transform .2s}
.theme[aria-checked="true"] .track{background:var(--gold)}
.theme[aria-checked="true"] .track::after{transform:translateX(14px);background:#fff}
@media (prefers-reduced-motion:reduce){.theme .track::after{transition:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 26px}
.brand b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--gold);display:block;line-height:1}
.brand small{font-size:8.5px;white-space:nowrap;letter-spacing:.24em;color:var(--gold-light);font-weight:600}
nav a{display:block;padding:10px 12px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500;font-size:16.5px}
nav a.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
nav a{display:flex;align-items:center} nav .count{margin-left:auto;background:var(--gold);color:var(--green);font-size:13.5px;font-weight:700;border-radius:999px;padding:1px 8px}
main{padding:24px 28px;min-width:0}
header{display:flex;align-items:end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 4px}
h1{font-family:var(--serif);font-weight:400;font-size:32px;margin:0;letter-spacing:-.01em}
h1 em{color:var(--gold-big)} /* #B99269 da 2.5:1 sobre crema; este pasa 3:1 para texto grande */
.switch{margin-left:auto;display:flex;gap:6px}
.pill{font:600 14.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:10px 18px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.pill.solid{background:var(--solid-bg);border-color:var(--solid-bg);color:var(--solid-text)}
.pill.sm{padding:7px 14px;font-size:13.5px}
.switch{align-items:center;gap:12px}
/* Toggle Día / Semana (segmented) */
.seg{display:inline-flex;gap:6px}
.seg button{font:600 13.5px var(--sans);padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--solid-bg);border-color:var(--solid-bg);color:var(--solid-text)}

/* Botones del rediseño (Inicio y Agenda · Día) */
.btn{font:600 15px var(--sans);border-radius:10px;padding:10px 16px;min-height:40px;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--accent)}
.btn.primary{background:var(--solid-bg);border-color:var(--solid-bg);color:var(--solid-text)}
.link{font:600 14px var(--sans);color:var(--accent);background:none;border:0;padding:6px 0;cursor:pointer;white-space:nowrap}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.over{font-size:13.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
main{container-type:inline-size} /* Inicio y Agenda se acomodan al ancho del contenido, no de la ventana */

/* Inicio: editorial, sin tarjetas salvo "Para resolver ahora" */
.home{max-width:1120px;margin:0 auto;padding:20px 20px 32px;display:flex;flex-direction:column;gap:40px}
.home-head{display:flex;align-items:flex-end;gap:32px}
.home-head>div{flex:1;min-width:0}
.home .hoy{font-size:112px;line-height:.92;letter-spacing:-.035em;color:var(--accent)}
.home .fecha{font:italic 400 32px/1.15 var(--serif);letter-spacing:-.01em;color:var(--accent);margin:14px 0 0}
.home .bajada{margin:18px 0 0;font-size:18px;line-height:1.5;color:var(--muted);max-width:480px;text-wrap:pretty}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metrics div{padding:18px 24px;display:flex;flex-direction:column;gap:4px;min-width:0}
.metrics div:first-child{padding-left:0}
.metrics div+div{border-left:1px solid var(--line)}
.metrics b{font:400 44px/1 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.metrics span{font-size:15px;color:var(--muted);line-height:1.3}
.home-cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:40px;align-items:start}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--accent)}
.sec-head h2{margin:0;font:400 24px var(--serif);color:var(--accent)}
.sec-head small{font-size:14.5px;color:var(--muted)}
.sec-head .link{margin-left:auto}
.h-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;column-gap:20px;row-gap:4px;align-items:baseline;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.h-row:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.h-row time{font:400 20px var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.h-row .who{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:16.5px;line-height:1.35;text-wrap:pretty}
.h-row .who b{font-weight:600}
.h-row .who small{font-size:14px;color:var(--muted)}
.h-row.fue,.h-row.fue time{color:var(--muted)}
.st{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;justify-self:end}
.st.flag{color:var(--text);font-weight:600}
.st.sigue{color:var(--accent);font-weight:600}
.resolver{background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(0,63,54,.05),0 10px 30px rgba(0,63,54,.06);overflow:hidden;min-width:0}
.resolver h2{display:flex;align-items:center;gap:10px;margin:0;padding:18px 24px 14px;font:400 22px var(--serif);color:var(--accent)}
.resolver h2 .dot{width:8px;height:8px}
.r-sub{display:flex;align-items:center;justify-content:space-between;padding:6px 24px;border-top:1px solid var(--line)}
.r-item{display:flex;flex-direction:column;gap:8px;padding:12px 24px 14px;border-top:1px solid var(--line)}
.r-item>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-item .canal{font-size:13px;font-weight:600;color:var(--accent);background:var(--page);padding:3px 8px;border-radius:6px}
.r-item b{font-size:16px;font-weight:600}
.r-item time{font-size:14px;color:var(--muted);margin-left:auto}
.r-item q{font-size:15.5px;line-height:1.45;text-wrap:pretty}
.r-item .btn{align-self:flex-start}
.r-fu{flex-direction:row;align-items:center;gap:12px}
.r-fu span{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.r-fu small{font-size:14.5px;color:var(--muted);text-wrap:pretty}
.r-empty{padding:8px 24px 18px;font-size:15px;color:var(--muted)}

/* Agenda · Día (V1 Tarjeta): resumen en verde, "Requiere atención" y la lista del día */
.hero{background:#003F36;color:#F5F1EC;border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;gap:22px;margin-bottom:18px}
.hero-top{display:flex;align-items:flex-end;gap:24px}
.hero-top>div{flex:1;min-width:0}
.hero .over{color:var(--gold);margin-bottom:8px}
.hero h2{margin:0;font:500 36px/1.1 var(--serif);letter-spacing:-.01em;text-wrap:pretty}
.hero .btn{background:#fff;color:#003F36;border-color:#DED1CB}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:rgba(245,241,236,.16);border-radius:12px;overflow:hidden}
.stats>div{background:#003F36;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stats span,.stats small{font-size:13.5px;color:rgba(245,241,236,.78);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.stats small{color:rgba(245,241,236,.72)}
.stats span{white-space:normal} /* con letra más grande, la etiqueta baja de renglón en vez de cortarse */
.stats b{font:500 30px/1 var(--serif);font-variant-numeric:tabular-nums}
.stats b.warn{color:var(--gold)}
.need{background:var(--surface);border:1px solid var(--gold);border-radius:16px;overflow:hidden;margin-bottom:18px}
.need-head{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--pend-bg);border-bottom:1px solid var(--line)}
.need-head h2{margin:0;font:500 18px var(--serif);color:var(--accent)}
.need-head small{margin-left:auto;font-size:14px;font-weight:600;color:var(--gold-text)}
.need-row{display:flex;align-items:center;gap:20px;padding:16px 20px}
.need-row+.need-row{border-top:1px solid var(--line)}
.need-row>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.need-row b{font-size:16px;font-weight:600}
.need-row b span{font-weight:500;color:var(--muted)}
.need-row p{margin:0;font-size:15px;line-height:1.45;text-wrap:pretty}
.dlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dlist-head{display:flex;align-items:baseline;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.dlist-head h2{margin:0;font:500 18px var(--serif);color:var(--accent)}
.dlist-head small{font-size:14px;color:var(--muted)}
.d-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;column-gap:18px;row-gap:8px;width:100%;padding:14px 20px;border:0;background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.d-row+.d-row{border-top:1px solid var(--line)}
.d-row:hover{background:var(--page)}
.d-row.sig{background:var(--page);box-shadow:inset 3px 0 0 var(--accent)}
.d-row.fue{opacity:.62}
.d-row.sel{outline:2px solid var(--text);outline-offset:-2px}
.d-row .hora{align-self:start;display:flex;flex-direction:column;gap:2px}
.d-row .hora time{font:500 20px/1.1 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.d-row .hora small{font-size:13px;color:var(--muted)}
.d-row .who{min-width:0;display:flex;flex-direction:column;gap:3px}
.d-row .who>span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-row .who b{font-size:16.5px;font-weight:600}
.d-row .who em{font-style:normal;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.d-row .who .dot{width:7px;height:7px}
.d-row .who small{font-size:15px;text-wrap:pretty}
.st-pill{justify-self:end;font-size:13.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st-pill.donep{background:var(--done-bg);color:var(--muted)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.layout .detail{position:sticky;top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* Semana (2b): lunes a sábado, 08–20 h, 1,2 px por minuto (72 px por hora). Encabezado de días fijo al scrollear. */
.wk{overflow:auto;max-height:calc(100dvh - 210px);overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.wk-in{min-width:860px}
.wk-top,.wk-body{display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr))}
.wk-top{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.wk-top>div{display:flex;align-items:baseline;gap:6px;padding:10px;border-left:1px solid var(--line);min-width:0}
.wk-top>div:first-child{border-left:0}
.wk-top b{font-size:15px;font-weight:600;white-space:nowrap}
.wk-top .hoy{background:var(--today-head)} .wk-top .hoy b{font-weight:700;color:var(--accent)}
.wk-top em{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.wk-top small{margin-left:auto;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-horas{position:relative}
.wk-horas span{position:absolute;right:8px;transform:translateY(-7px);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-dia{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--hour-line) 0,var(--hour-line) 1px,transparent 1px,transparent 72px);cursor:copy}
.wk-dia.hoy{background-color:var(--today-col)}
.wk-dia.pasado{cursor:default}
/* Franja cerrada: rayada, no se puede soltar ni agendar ahí */
.wk-cerrado{position:absolute;left:0;right:0;z-index:1;display:flex;align-items:center;justify-content:center;cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 70%,transparent) 6px 7px),color-mix(in srgb,var(--page) 80%,transparent)}
.wk-cerrado span{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface);padding:1px 8px;border-radius:999px}
.wk-now{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:4;pointer-events:none}
.wk-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* Bloque: alto = duración. Menos de 44 px, una línea (hora · punto · clienta); desde 58 px suma el tratamiento. */
.bl{position:absolute;z-index:2;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;padding:4px 7px;border-radius:8px;overflow:hidden;font:inherit;color:var(--text);text-align:left;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.bl:active{cursor:grabbing}
.bl-ok{background:var(--ok-bg);border:1px solid var(--wk-ok-line)}
.bl-pend{background:var(--surface);border:1px dashed var(--gold)}
.bl-past{background:var(--wk-past-bg);border:1px solid var(--wk-past-line);color:var(--muted);cursor:pointer}
.bl .h{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.bl-past .h{color:var(--muted)}
.bl b{font-size:13.5px;font-weight:600;line-height:1.25}
.bl .tx{font-size:12.5px;line-height:1.25}
.bl b,.bl .tx{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl.una{flex-direction:row;align-items:center;gap:5px;font-size:13px;line-height:1.3}
.bl.una .h,.bl.una b{font-size:13px}
.bl.una .h{flex:none} .bl.una b{min-width:0}
.bl.lev{opacity:.4}
.ghost{position:absolute;left:3px;right:3px;z-index:5;box-sizing:border-box;padding:3px 6px;border:2px solid var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 6%,transparent);pointer-events:none}
.ghost span{font-size:12.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--solid-bg);color:var(--solid-text);font-variant-numeric:tabular-nums}
.legend.wk-legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-sizing:border-box}
.sub{margin:6px 0 0;font-size:15px;color:var(--muted)}
/* Toast de "Deshacer" (2d): se cierra solo a los 5 s */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 12px 10px 16px;border-radius:12px;background:#003F36;color:#F5F1EC;font-size:15px;box-shadow:0 8px 24px rgba(0,63,54,.25)}
.toast[hidden]{display:none}
.toast button{font:600 14.5px var(--sans);color:#F5F1EC;background:rgba(245,241,236,.14);border:0;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}

/* Nuevo turno (2e): panel derecho de 460 px; en celular, hoja desde abajo */
.nt{position:fixed;inset:0;z-index:30}
.nt[hidden]{display:none}
.nt-ov{position:absolute;inset:0;background:rgba(29,43,40,.32)}
.nt-panel{position:absolute;top:0;right:0;bottom:0;width:460px;max-width:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--page);box-shadow:0 10px 40px rgba(0,63,54,.18)}
.nt-head{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.nt-head>div{flex:1;min-width:0}
.nt-head .over{margin:0}
.nt-head h2{margin:4px 0 0;font:500 30px/1.1 var(--serif);color:var(--accent)}
.x{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:18px;line-height:1;cursor:pointer}
.nt-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 24px;display:flex;flex-direction:column;gap:24px}
.fs{display:flex;flex-direction:column;gap:8px}
.fs-h{display:flex;align-items:baseline;gap:8px}
.fs-h>:nth-child(2){margin-left:auto}
.fs-err{margin:0;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--gold-text)}
.rango{font-size:14.5px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.field{width:100%;box-sizing:border-box;min-height:44px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:15.5px var(--sans)}
.field:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.field::placeholder{color:var(--muted)}
textarea.field{resize:vertical;line-height:1.45}
.field.abierto{border-radius:10px 10px 0 0}
.desplegable{position:relative;display:block}
.desplegable select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:36px}
.desplegable::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--accent);border-bottom:1.6px solid var(--accent);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.res{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;overflow:hidden}
.res button{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--text);font:15.5px var(--sans);text-align:left;cursor:pointer}
.res button:first-child{border-top:0}
.res button:hover{background:var(--page)}
.res button.add{font-weight:600;color:var(--accent);background:var(--page)}
.cli{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cli>div{display:flex;align-items:center;gap:12px}
.cli b{display:block;font-size:16.5px;font-weight:600}
.cli small{font-size:14px;color:var(--muted)}
.av{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--ok-bg);color:var(--ok-text)}
.av.nueva{background:var(--pend-bg);color:var(--pend-text)}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.chips.horas{gap:6px;margin-top:4px}
.chip{min-height:44px;padding:6px 8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font:600 14.5px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.chip small{font-size:12.5px;font-weight:400;color:var(--muted)}
.chip.on{background:var(--solid-bg);border-color:var(--solid-bg);color:var(--solid-text)}
.chip.on small{color:inherit;opacity:.78}
.chip:disabled{background:transparent;color:#A9AFAC;opacity:.7;cursor:default}
.nt-vacio{margin:0;padding:10px 0 2px;font-size:14.5px;color:var(--muted)}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.check b{display:block;font-size:15.5px;font-weight:600}
.check small{display:block;margin-top:2px;font-size:14px;line-height:1.4;color:var(--muted);text-wrap:pretty}
.nt-pie{display:flex;flex-direction:column;gap:10px;padding:14px 24px 16px;border-top:1px solid var(--line);background:var(--surface)}
.nt-pie p{margin:0;min-height:18px;font-size:14.5px;line-height:1.4;color:var(--muted)}
.nt-pie p.listo{color:var(--text)}
.nt-pie>div{display:flex;gap:8px}
.nt-pie .btn.primary{flex:1}
.nt-pie[hidden]{display:none}
.nt-descartar p{color:var(--text)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
@media (max-width:640px){
  .nt-panel{top:6%;left:0;width:auto;border-radius:20px 20px 0 0}
  .nt-head{padding:16px 18px}
  .nt-head h2{font-size:26px}
  .nt-body{padding:20px 18px 24px}
  .nt-pie{padding:14px 18px 18px}
  .nt-pie>div{flex-direction:column-reverse}
  .chips{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chips.horas{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* Estados (badges, píldoras y avisos) */
.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-text)}
.pend{background:var(--pend-bg);border-color:var(--pend);color:var(--pend-text)}
.alert{background:var(--alert-bg);border-color:var(--alert);color:var(--alert-text)}
.ic{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:12.5px;font-weight:700;color:var(--ic-text);flex:none;align-self:center}
.alert .ic{background:var(--alert)} .pend .ic{background:var(--pend)}

/* Detalle */
.detail{padding:20px}
.detail h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:4px 0 2px}
.detail .when{color:var(--muted);font-variant-numeric:tabular-nums;margin:0 0 14px}
.badge{display:inline-block;font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.detail ul{margin:6px 0 16px;padding-left:18px}
.detail dl{margin:0 0 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px}
.detail dt{color:var(--muted)}
.detail dd{margin:0}
.legend{display:flex;gap:16px;font-size:15px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{font-size:14.5px;color:var(--muted);margin-top:14px}

/* Clientes y Mensajes: lista a la izquierda, detalle a la derecha */
.two{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.list{padding:8px}
.search{width:100%;padding:9px 14px;margin-bottom:6px;border:1px solid var(--line);border-radius:999px;background:var(--page);color:var(--text);font:16.5px var(--sans)}
.search::placeholder{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--page)}
.row.on{background:var(--page);box-shadow:inset 3px 0 0 var(--text)}
.row .who{flex:1;min-width:0}
.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread b{font-weight:700} .row.unread small{color:var(--text)}
.row time{align-self:flex-start;margin-top:2px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ic-alert{background:var(--alert)} .ic-pend{background:var(--pend)}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}

.ficha{padding:24px}
.ficha h2{font:400 30px var(--serif);letter-spacing:-.01em;margin:4px 0 2px}
.meta{color:var(--muted);margin:0 0 6px;font-variant-numeric:tabular-nums}
.block{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:12px}
.plain{margin:0 0 12px}
.next{display:flex;align-items:center;gap:12px;padding:12px 14px;border-left:3px solid;border-radius:10px}
.next strong,.next span:not(.ic){display:block}
.next span:not(.ic){font-size:15.5px;margin-top:2px}

.chat{display:flex;flex-direction:column}
.linked{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:16px}
.thread{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.day{align-self:center;font-size:13.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.msg{max-width:72%;margin:0;padding:9px 13px;border-radius:14px;font-size:16.5px;line-height:1.45}
.msg small{display:block;margin-top:3px;font-size:13.5px;color:var(--muted)}
.msg.in{align-self:flex-start;background:var(--page);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--ok-bg);color:var(--ok-text);border-bottom-right-radius:4px}
.msg.out small{color:inherit;opacity:.75}
.draft{margin:0 20px 14px;padding:12px 14px;border:1px dashed var(--gold-light);border-radius:14px}
.draft label{display:block;font-size:13.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text)}
.draft textarea{width:100%;margin:6px 0 8px;border:0;background:transparent;color:var(--text);font:16.5px/1.5 var(--sans);resize:vertical}
.draft textarea:focus-visible{outline:none}
.draft:focus-within{border-style:solid;border-color:var(--gold)}
.reply{border-style:solid;border-color:var(--line)} .reply label{color:var(--muted)} .reply:focus-within{border-color:var(--text)}
.draft textarea::placeholder{color:var(--muted)}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.act small{margin-right:auto;font-size:14.5px;color:var(--muted)}
.fine{margin:0 20px 18px;font-size:14.5px;color:var(--muted)}
.notice{margin:0 20px 14px;flex-wrap:wrap}
.notice .ic{align-self:flex-start;margin-top:2px}
.notice .grow{flex:1 1 calc(100% - 40px)} /* el texto ocupa la línea entera; los botones pasan abajo */
.notice .pill:first-of-type{margin-left:26px}
.done{color:var(--ok-text);font-weight:600}

/* Aviso flotante para lo que la demo todavía no hace */
.aviso{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;max-width:calc(100% - 32px);padding:11px 18px;border-radius:999px;background:var(--solid-bg);color:var(--solid-text);font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.18)}

@media (max-width:900px){
  .two{grid-template-columns:minmax(0,1fr)} /* minmax: la vista previa de un chat se corta con "…" en vez de ensanchar la página */
  /* En pantallas angostas la barra lateral pasa a ser una barra arriba, con menú y switch */
  .app{grid-template-columns:1fr}
  .sidebar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 16px}
  .brand{padding:0 6px 0 0}
  .sidebar nav{display:grid;grid-template-columns:1fr 1fr;gap:2px;order:3;width:100%} /* en el celular, los cuatro botones en 2 × 2 debajo del logo */
  nav a{padding:8px 10px}
  .theme{margin:0 0 0 auto}
  main{padding:16px}
  .layout{grid-template-columns:minmax(0,1fr)}
}
@container (max-width:960px){
  .home-cols{grid-template-columns:minmax(0,1fr);gap:32px}
}
@container (max-width:640px){
  .wk-in{min-width:760px}
  .home{padding:8px 2px 28px;gap:28px}
  .home-head,.hero-top,.need-row{flex-direction:column;align-items:stretch;gap:16px}
  .home .hoy{font-size:72px}
  .home .fecha{font-size:24px;margin-top:10px}
  .home .bajada{font-size:16.5px;margin-top:14px}
  .metrics div{padding:14px 10px 14px 12px}
  .metrics b{font-size:34px}
  .metrics span{font-size:14px}
  .h-row,.d-row{grid-template-columns:52px minmax(0,1fr);column-gap:12px}
  .h-row time,.d-row .hora time{font-size:18px}
  .h-row .st,.d-row .st-pill{grid-column:2;justify-self:start}
  .r-sub,.r-item{padding-left:16px;padding-right:16px}
  .r-item .btn{align-self:stretch}
  .hero{padding:20px 18px}
  .hero h2{font-size:28px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats span,.stats small{white-space:normal}
  .stats b{font-size:26px}
  .d-row,.need-row,.need-head,.dlist-head{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="aviso" id="aviso" role="status" hidden></div>
<div class="toast" id="toast" role="status" hidden><span id="toast-txt"></span><button onclick="deshacer()">Deshacer</button></div>
<!-- Nuevo turno (2e): panel a la derecha; en celular, hoja desde abajo. Se arma en pintarForm(). -->
<div class="nt" id="nt" hidden>
  <div class="nt-ov" onclick="cerrarNuevo()"></div>
  <div class="nt-panel" role="dialog" aria-modal="true" aria-labelledby="nt-tit">
    <div class="nt-head"><div><p class="over">Nuevo turno</p><h2 id="nt-tit">Agendar turno</h2></div><button class="x" aria-label="Cerrar" onclick="cerrarNuevo()">×</button></div>
    <div class="nt-body" id="nt-body"></div>
    <div class="nt-pie" id="nt-pie"><p id="nt-resumen"></p><div><button class="btn quiet" onclick="cerrarNuevo()">Cancelar</button><button class="btn primary" id="nt-ok" onclick="agendar()">Agendar turno</button></div></div>
    <div class="nt-pie nt-descartar" id="nt-descartar" role="alert" hidden><p><strong>Descartar el turno?</strong> Se pierde lo que cargaste.</p><div><button class="btn quiet" id="nt-seguir" onclick="seguirEditando()">Seguir editando</button><button class="btn primary" onclick="cerrarNuevo(true)">Descartar</button></div></div>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="20" viewBox="0 0 100 78" fill="none" stroke="#B99269" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M50 8C57 24 57 42 50 56C43 42 43 24 50 8Z"/><path d="M50 56C41 49 34 38 34 24C43 30 49 43 50 56Z"/><path d="M50 56C59 49 66 38 66 24C57 30 51 43 50 56Z"/><path d="M50 58C37 57 23 50 16 39C31 38 45 46 50 58Z"/><path d="M50 58C63 57 77 50 84 39C69 38 55 46 50 58Z"/></svg>
      <div><b>Okio</b><small>ESTÉTICA Y BIENESTAR</small></div>
    </div>
    <nav>
      <a class="on" href="#" id="nav-inicio" onclick="ir('inicio');return false">Inicio</a>
      <a href="#" id="nav-agenda" onclick="ir('agenda');return false">Agenda<span class="count" title="2 turnos requieren atención hoy">2</span></a>
      <a href="#" id="nav-clientes" onclick="ir('clientes');return false">Clientes</a>
      <a href="#" id="nav-mensajes" onclick="ir('mensajes');return false">Mensajes<span class="count" title="1 mensaje sin leer">1</span></a>
    </nav>
    <button class="theme" id="tema" role="switch" aria-checked="false" onclick="cambiarTema()">Modo oscuro<span class="track" aria-hidden="true"></span></button>
  </aside>

  <main>
    <!-- Inicio: el día de un vistazo y lo que hay que resolver. Se arma en pintarInicio(). -->
    <section id="pantalla-inicio"><div class="home" id="home"></div></section>

    <section id="pantalla-agenda" hidden>
    <header>
      <div>
        <p class="eyebrow" id="eyebrow">Agenda · Día</p>
        <h1 id="titulo">Agenda</h1>
        <p class="sub" id="bajada" hidden></p>
      </div>
      <div class="switch">
        <div class="seg" role="group" aria-label="Vista"><button class="on" id="btn-dia" aria-pressed="true" onclick="ver('dia')">Día</button>
        <button id="btn-semana" aria-pressed="false" onclick="ver('semana')">Semana</button></div>
        <button class="btn primary" id="btn-turno" onclick="nuevoTurno()">+ Nuevo turno</button>
      </div>
    </header>

    <!-- Día: resumen, lo que requiere atención y la lista del día. Maqueta: hora fija 15:20. -->
    <div id="vista-dia">
      <section class="hero" id="hero" aria-label="Resumen del día"></section>
      <section class="need" id="attn" aria-label="Requiere atención"></section>
      <div class="layout">
        <section class="dlist" id="lista-dia" aria-label="Turnos del día"></section>
        <aside class="card detail" id="detalle" aria-live="polite"></aside>
      </div>
    </div>

    <!-- Semana: lunes a sábado, una columna por día. Arrastrar = mover; click en un espacio libre = turno nuevo. -->
    <div id="vista-semana" hidden>
      <section id="cal-semana" class="wk" aria-label="Agenda de la semana"></section>
      <div class="legend wk-legend">
        <span><i class="bl-ok"></i>Confirmado</span>
        <span><i class="bl-pend"></i>Sin confirmar</span>
        <span><i class="bl-past"></i>Atendido</span>
      </div>
    </div>
    <p class="legend">Datos ficticios · logo provisorio</p>
    </section>

    <!-- Clientes: la lista responde "quién es?"; la ficha, "quién es y cuándo vuelve?". Lo clínico queda detrás de un acceso restringido. -->
    <section id="pantalla-clientes" hidden>
      <header>
        <div>
          <p class="eyebrow">Clientes · 7 fichas</p>
          <h1>Clientes</h1>
        </div>
        <div class="switch"><button class="pill solid" onclick="aviso('Cargar clientas nuevas todavía no está en la demo.')">+ Clienta</button></div>
      </header>
      <div class="two">
        <section class="card list" aria-label="Lista de clientas">
          <input class="search" id="buscar" type="search" oninput="filtrarClientas(this.value)" placeholder="Buscar por nombre o teléfono" aria-label="Buscar clienta">
          <div id="lista-clientas"></div>
        </section>

        <!-- Se arma desde CLIENTAS (script al final) -->
        <section class="card ficha" id="ficha" aria-live="polite"></section>
      </div>
    </section>

    <!-- Mensajes: el turno vinculado en una línea; el borrador punteado = "todavía no es real", igual que los huecos libres. -->
    <section id="pantalla-mensajes" hidden>
      <header>
        <div>
          <p class="eyebrow">Mensajes · WhatsApp simulado</p>
          <h1>Mensajes</h1>
        </div>
      </header>
      <div class="two">
        <section class="card list" aria-label="Conversaciones">
          <div id="lista-mensajes"></div>
        </section>

        <!-- Se arma desde CONVERSACIONES (script al final) -->
        <section class="card chat" id="chat" aria-live="polite"></section>
      </div>
    </section>
  </main>
</div>
<script>
// Semana ficticia, lunes a sábado (el sábado sin turnos). El jueves (hoy) sale de HOY, más abajo.
var DIAS = [
  {d:'Lun', n:14, largo:'lunes 14'}, {d:'Mar', n:15, largo:'martes 15'}, {d:'Mié', n:16, largo:'miércoles 16'},
  {d:'Jue', n:17, largo:'jueves 17', hoy:true}, {d:'Vie', n:18, largo:'viernes 18'}, {d:'Sáb', n:19, largo:'sábado 19'}
];
var HOY_D = 3;
// día|inicio|fin|clienta|tratamiento|estado (sin estado = ya pasó)
var OTROS = [
  '0|10:00|11:00|Julieta Moreno|Limpieza facial profunda',
  '2|17:00|18:00|Rocío Benítez|Radiofrecuencia facial'
].map(function(s){ var x = s.split('|'); return {d:+x[0], ini:x[1], fin:x[2], c:x[3], tx:x[4], estado:x[5] || 'past'}; });

// Escala del calendario: 64 px por hora; el corte 13–15 ocupa una franja de 34 px.
var PX = 64 / 60, CORTE = 34;
function y(m){ return m <= 780 ? (m - 540) * PX : 240 * PX + CORTE + (Math.max(m, 900) - 900) * PX; }
function minDeY(px){ return px <= 240 * PX ? 540 + px / PX : 900 + (px - 240 * PX - CORTE) / PX; }
function hhmm(m){ return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function corto(nombre){ var p = nombre.split(' '); return p[0] + ' ' + p[1][0] + '.'; }

// Clientas ficticias. estado: ok = confirmado, pend = sin confirmar, alert = requiere atención.
var ESTADOS = {
  ok:    {texto:'Confirmado', ic:''},
  pend:  {texto:'Sin confirmar', ic:'?'},
  alert: {texto:'Avisó que no puede venir', ic:'!'}
};
var CLIENTAS = [
  {nombre:'Agustina Paz', tel:'+54 351 000-0001', desde:'enero 2026', ultima:'Jueves 20 de agosto · Peeling facial',
   prox:{tx:'Peeling facial', estado:'ok'}},
  {nombre:'Camila Reyes', tel:'+54 351 000-0002', desde:'mayo 2026', ultima:'Martes 8 de septiembre · Limpieza facial profunda', prox:null},
  {nombre:'Florencia Díaz', tel:'+54 351 000-0003', desde:'junio 2026', ultima:'Jueves 27 de agosto · Depilación definitiva', prox:null},
  {nombre:'Luciana Ferreyra', tel:'+54 351 000-0000', desde:'marzo 2026', ultima:'Jueves 3 de septiembre · Peeling facial',

// Turnos de clientas con ficha (casi todos hoy; d = día si no es hoy). Estado y tratamientos salen de CLIENTAS;
// rec = cómo va el recordatorio. La demo tiene 6 turnos en toda la semana: estos 4 y los 2 de OTROS.
var HOY = [
  {c:'Valentina Sosa',   ini:'09:00', fin:'10:00', rec:'Enviado ayer · confirmó'},
  {c:'Sofía Ramos',      ini:'15:00', fin:'15:40', rec:'Enviado · avisó que no puede venir'},
  {c:'Luciana Ferreyra', ini:'16:00', fin:'17:30', rec:'Todavía no enviado'},
  {c:'Agustina Paz',     ini:'10:00', fin:'11:00', rec:'Enviado hoy · confirmó', d:4}
];
HOY.forEach(function(t){ var p = clientaDe(t.c).prox; if (t.d == null) t.d = HOY_D; t.tx = p.tx; t.estado = p.estado; });
// Toda la semana en una sola lista, para poder mover turnos entre días. Los de hoy van primero:
// su índice es el mismo en HOY y en TURNOS. El día de cada turno está en t.d (puede cambiar al arrastrarlo).
var TURNOS = HOY.concat(OTROS);
var AHORA = '15:20', turnoSel = 2; // Luciana, la del recorrido de la demo

function minutos(h){ var x = h.split(':'); return +x[0] * 60 + +x[1]; }
function turnoDe(nombre){ for (var i = 0; i < TURNOS.length; i++) if (TURNOS[i].c === nombre) return i; return -1; }
function convDe(nombre){ for (var i = 0; i < CONVERSACIONES.length; i++) if (CONVERSACIONES[i].nombre === nombre) return i; return -1; }
function nuevoTurno(){ abrirNuevo(); }
// Índices de los turnos de un día, en orden cronológico.
function delDia(d){
  return TURNOS.map(function(t, i){ return i; }).filter(function(i){ return TURNOS[i].d === d; })
    .sort(function(a, b){ return minutos(TURNOS[a].ini) - minutos(TURNOS[b].ini); });
}
function deHoy(){ return delDia(HOY_D); }
function diaLargo(d){ return d === HOY_D ? 'hoy, ' + DIAS[d].largo : DIAS[d].largo; }
// Fecha del turno de una clienta, para Clientes y Mensajes. Sale del turno, así sigue bien si se lo mueve.
function cuandoCorto(nombre){ var t = TURNOS[turnoDe(nombre)]; return DIAS[t.d].d + ' ' + DIAS[t.d].n + ' · ' + t.ini; }
function cuandoLargo(nombre){ var t = TURNOS[turnoDe(nombre)], l = DIAS[t.d].largo; return l.charAt(0).toUpperCase() + l.slice(1) + ' · ' + t.ini + '–' + t.fin; }

// Estado de un turno de hoy, visto desde recepción. "Avisó que no viene" y "sin confirmar" pesan más que la hora.
var TEXTO_HOY = {done:'Atendida', sent:'Recordatorio enviado'};
function estadoHoy(t){
  if (t.estado === 'alert') return 'alert';
  if (fue(t)) return 'done';
  return t.estado === 'pend' && t.enviado ? 'sent' : t.estado;
}
function fue(t){ return t.estado === 'past' || t.d < HOY_D || (t.d === HOY_D && minutos(t.fin) <= minutos(AHORA)); }
function textoEstado(s){ return TEXTO_HOY[s] || ESTADOS[s].texto; }
function pillEstado(s){ return '<span class="st-pill ' + ({done:'donep', sent:'pend'}[s] || s) + '">' + textoEstado(s) + '</span>'; }
function proximo(){ return deHoy().filter(function(i){ return minutos(TURNOS[i].ini) > minutos(AHORA); })[0]; }
function duracion(t){ return (minutos(t.fin) - minutos(t.ini)) + ' min'; }
// Lo que recepción tiene que hacer antes del turno. accion = botón; sin botón, la fila queda como aviso.
// El recordatorio con IA solo está para las clientas con ficha en la demo.
function pendientesHoy(){
  return deHoy().map(function(i){
    var t = TURNOS[i], s = estadoHoy(t);
    if (s === 'alert') return {i:i, texto:'Avisó por WhatsApp que no puede venir. El turno sigue en pie hasta que elija otro horario.',
      accion:'<button class="btn primary" onclick="responder(\'' + t.c + '\')">Responder</button>'};
    if (s === 'pend' && t.reserva) return {i:i, texto:'Turno nuevo. La confirmación por WhatsApp está en borrador.',
      accion:'<button class="btn primary" onclick="ir(\'mensajes\');elegirConversacion(convDe(\'' + t.c + '\'))">Revisar confirmación</button>'};
    if (s === 'pend') return {i:i, texto:'Sin confirmar y todavía no se le mandó el recordatorio.',
      accion: clientaDe(t.c) ? '<button class="btn primary" onclick="prepararRecordatorio(' + i + ')">Preparar recordatorio</button>' : ''};
    if (s === 'sent') return {i:i, texto:'Sin confirmar. ' + t.rec + '.', accion:''};
  }).filter(Boolean);
}

// Semana (2b): lunes a sábado, 08–20 h, 1,2 px por minuto. Los turnos que se pisan van lado a lado
// (carriles), sin decir de quién es cada uno. Se arrastran con el puntero (mouse o dedo), de a 15 min.
var WK0 = 480, WK1 = 1200, WPX = 1.2, SNAP = 15;
function yS(m){ return (m - WK0) * WPX; }
// Horario de Okio: lunes a viernes, 09–13 y 15–20. El sábado y las franjas de 08–09 y 13–15 se ven "Cerrado"
// y no aceptan turnos (ni soltados ni nuevos). Cada franja: [desde, hasta] en minutos.
var SABADO = 5, CERRADO = [[480, 540], [780, 900]];
function cerrado(d, a, b){
  return d === SABADO || CERRADO.some(function(f){ return a < f[1] && b > f[0]; });
}
function franjasCerradas(d){
  var fr = d === SABADO ? [[WK0, WK1]] : CERRADO;
  return fr.map(function(f){
    return '<div class="wk-cerrado" style="top:' + yS(f[0]) + 'px;height:' + (f[1] - f[0]) * WPX + 'px"><span>Cerrado</span></div>';
  }).join('');
}
function carriles(ids){
  var fines = [], grupo = [], hasta = -1;
  function cerrar(){ grupo.forEach(function(t){ t.n = fines.length; }); grupo = []; fines = []; }
  ids.forEach(function(i){
    var t = TURNOS[i], a = minutos(t.ini), b = minutos(t.fin);
    if (a >= hasta) cerrar();
    var k = fines.findIndex(function(f){ return f <= a; });
    if (k < 0) { k = fines.length; fines.push(b); } else fines[k] = b;
    hasta = Math.max(hasta, b); t.k = k; grupo.push(t);
  });
  cerrar();
  return ids;
}

function bloque(i){
  var t = TURNOS[i], a = minutos(t.ini), alto = (minutos(t.fin) - a) * WPX - 3, pasado = fue(t);
  var sinConf = !pasado && t.estado !== 'ok', tipo = pasado ? 'past' : sinConf ? 'pend' : 'ok';
  var estado = pasado ? 'Atendido' : ESTADOS[t.estado].texto;
  var hora = '<span class="h">' + t.ini + (sinConf ? '<i class="dot"></i>' : '') + '</span>';
  return '<button class="bl bl-' + tipo + (alto < 44 ? ' una' : '') + '" data-i="' + i + '"' +
    ' style="top:' + (yS(a) + 1) + 'px;height:' + alto + 'px;left:calc(' + (100 * t.k / t.n) + '% + 3px);width:calc(' + (100 / t.n) + '% - 6px)"' +
    ' title="' + t.ini + '–' + t.fin + ' · ' + t.c + ' — ' + t.tx + ' · ' + estado + '"' +
    (pasado ? '' : ' onpointerdown="agarrar(event,' + i + ')" onpointermove="arrastrar(event)" onpointerup="soltar()" onpointercancel="cancelar()"') +
    ' onclick="tocar(' + i + ')">' + hora + '<b>' + t.c + '</b>' + (alto > 58 ? '<span class="tx">' + t.tx + '</span>' : '') + '</button>';
}

function pintarSemana(){
  var dias = [0, 1, 2, 3, 4, 5], top = '<div></div>', body = '<div class="wk-horas" style="height:' + yS(WK1) + 'px">';
  for (var m = WK0 + 60; m < WK1; m += 60) body += '<span style="top:' + yS(m) + 'px">' + hhmm(m) + '</span>';
  body += '</div>';
  dias.forEach(function(d){
    var x = DIAS[d], ids = delDia(d), hoy = d === HOY_D;
    top += '<div' + (hoy ? ' class="hoy"' : '') + '><b>' + x.d + ' ' + x.n + '</b>' + (hoy ? '<em>Hoy</em>' : '') + '<small>' + ids.length + '</small></div>';
    body += '<div class="wk-dia' + (hoy ? ' hoy' : '') + (d < HOY_D ? ' pasado' : '') + '" data-d="' + d + '" style="height:' + yS(WK1) + 'px" onclick="nuevoEn(event,this)">' +
      franjasCerradas(d) + carriles(ids).map(bloque).join('') +
      (hoy ? '<div class="wk-now" style="top:' + yS(minutos(AHORA)) + 'px"></div>' : '') + '</div>';
  });
  document.getElementById('cal-semana').innerHTML = '<div class="wk-in"><div class="wk-top">' + top + '</div><div class="wk-body">' + body + '</div></div>';
  document.getElementById('bajada').textContent = TURNOS.length + ' turnos · Arrastrá un turno para moverlo · Tocalo para ver el detalle';
}

// Arrastre con Pointer Events: anda con mouse y con el dedo. El fantasma muestra adónde cae y a qué hora.
// sinClick: el click que el navegador manda al soltar un arrastre no abre el turno. Cada pointerdown lo limpia.
var arrastre = null, sinClick = false;
function agarrar(e, i){
  sinClick = false;
  if (e.button) return;
  var t = TURNOS[i], r = e.currentTarget.getBoundingClientRect();
  arrastre = {i:i, el:e.currentTarget, dy:e.clientY - r.top, x:e.clientX, y:e.clientY, dur:minutos(t.fin) - minutos(t.ini), dest:null, mov:false};
  e.currentTarget.setPointerCapture(e.pointerId);
}
function arrastrar(e){
  var a = arrastre;
  if (!a || (!a.mov && Math.abs(e.clientX - a.x) + Math.abs(e.clientY - a.y) < 5)) return;
  a.mov = true; a.el.classList.add('lev');
  var g = document.getElementById('ghost'); if (g) g.remove();
  a.dest = null;
  var col = [].filter.call(document.querySelectorAll('#cal-semana .wk-dia'), function(c){
    var r = c.getBoundingClientRect(); return e.clientX >= r.left && e.clientX < r.right;
  })[0];
  if (!col) return;
  var d = +col.dataset.d, m = WK0 + Math.round((e.clientY - col.getBoundingClientRect().top - a.dy) / WPX / SNAP) * SNAP;
  m = Math.max(WK0, Math.min(WK1 - a.dur, m));
  if (d < HOY_D || (d === HOY_D && m < minutos(AHORA))) return; // un turno no se mueve al pasado
  if (cerrado(d, m, m + a.dur)) return; // ni a un horario en que Okio está cerrado
  a.dest = {d:d, m:m};
  col.insertAdjacentHTML('beforeend', '<div class="ghost" id="ghost" style="top:' + (yS(m) + 1) + 'px;height:' + (a.dur * WPX - 3) + 'px"><span>' + hhmm(m) + '</span></div>');
}
function soltar(){
  var a = arrastre;
  cancelar();
  if (!a || !a.mov) return; // fue un toque: lo resuelve onclick
  sinClick = true;
  var t = TURNOS[a.i];
  if (a.dest && (a.dest.d !== t.d || hhmm(a.dest.m) !== t.ini)) mover(a.i, a.dest.d, a.dest.m);
}
function cancelar(){
  var g = document.getElementById('ghost'); if (g) g.remove();
  if (arrastre) arrastre.el.classList.remove('lev');
  arrastre = null;
}
function tocar(i){
  if (sinClick) { sinClick = false; return; }
  if (TURNOS[i].d === HOY_D) { ver('dia'); verTurno(i); }
  else aviso('La demo solo tiene el detalle de hoy, jueves 17.');
}

var deshacerUltimo = null, toastTimer;
function mover(i, d, m, sinToast){
  var t = TURNOS[i], antes = {d:t.d, m:minutos(t.ini)}, dur = minutos(t.fin) - minutos(t.ini);
  t.d = d; t.ini = hhmm(m); t.fin = hhmm(m + dur);
  pintarSemana(); elegirTurno(turnoSel);
  if (sinToast) return;
  avisarConDeshacer('Turno movido: ' + t.c + ' → ' + diaCorto(d) + ', ' + t.ini, function(){ mover(i, antes.d, antes.m, true); });
}
// Toast de 5 s con "Deshacer" (mover y agendar).
function avisarConDeshacer(texto, fn){
  deshacerUltimo = fn;
  document.getElementById('toast-txt').textContent = texto;
  document.getElementById('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(cerrarToast, 5000);
}
function deshacer(){ if (deshacerUltimo) deshacerUltimo(); deshacerUltimo = null; cerrarToast(); }
function cerrarToast(){ document.getElementById('toast').hidden = true; }

// Nuevo turno (2e). Tratamientos de la demo con su duración; sin precios (Okio es real y un precio inventado confunde).
var TRATAMIENTOS = [
  ['Limpieza facial profunda', 60], ['Peeling facial', 60], ['Peeling corporal', 60], ['Depilación definitiva', 40],
  ['Dermaplaning', 60], ['Radiofrecuencia facial', 60], ['Microneedling', 90], ['Drenaje linfático', 90]
];
// Cupo: cuántos turnos puede haber a la vez. Nunca se muestra; la pantalla no nombra ni cuenta a las profesionales.
var CUPO = 2;
var F = null; // estado del formulario abierto
function sinAcentos(x){ return x.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function durDe(tx){ var t = TRATAMIENTOS.filter(function(x){ return x[0] === tx; })[0]; return t ? t[1] : 0; }
// Horarios libres de un día, cada 30 min: abierto, sin pasarse del cupo y, si es hoy, desde ahora + 20 min.
function libres(d, dur){
  var desde = d === HOY_D ? Math.ceil((minutos(AHORA) + 20) / 30) * 30 : WK0, out = [];
  for (var m = WK0; m + dur <= WK1; m += 30) {
    if (m < desde || cerrado(d, m, m + dur)) continue;
    var aLaVez = TURNOS.filter(function(t){ return t.d === d && minutos(t.ini) < m + dur && minutos(t.fin) > m; }).length;
    if (aLaVez < CUPO) out.push(hhmm(m));
  }
  return out;
}
function diaCorto(d){ return d === HOY_D ? 'Hoy' : DIAS[d].d + ' ' + DIAS[d].n; }
function iniciales(n){ return n.split(' ').map(function(w){ return w[0]; }).slice(0, 2).join('').toUpperCase(); }

// pre: {d, hora} desde un espacio libre de la Semana, o {cliente} desde una ficha.
function abrirNuevo(pre){
  pre = pre || {};
  F = {q:'', cliente: pre.cliente ? {nombre:pre.cliente} : null, tel:'', tx:'', d: pre.d != null && pre.d >= HOY_D ? pre.d : HOY_D,
       hora: pre.hora || '', wa:true, notas:'', intentado:false};
  F.inicial = cargado();
  F.volver = document.activeElement;
  document.querySelector('.app').inert = true; // Tab no se escapa a la pantalla de atrás
  document.getElementById('nt').hidden = false;
  pintarForm();
  var q = document.getElementById('nt-q'); if (q) q.focus();
}
// Lo que la persona cargó: si cambió desde que se abrió, cerrar pregunta antes de descartar.
function cargado(){ return JSON.stringify([F.q, F.cliente, F.tel, F.tx, F.d, F.hora, F.wa, F.notas]); }
function seguirEditando(){
  document.getElementById('nt-descartar').hidden = true;
  document.getElementById('nt-pie').hidden = false;
  document.getElementById('nt-ok').focus();
}
function cerrarNuevo(descartar){
  if (!descartar && F && cargado() !== F.inicial) {
    document.getElementById('nt-pie').hidden = true;
    document.getElementById('nt-descartar').hidden = false;
    document.getElementById('nt-seguir').focus();
    return;
  }
  seguirEditando(); // deja el pie normal para la próxima vez
  var volver = F && F.volver;
  document.getElementById('nt').hidden = true; F = null;
  document.querySelector('.app').inert = false;
  if (volver && document.contains(volver)) volver.focus();
}
addEventListener('keydown', function(e){
  if (e.key !== 'Escape' || !F) return;
  if (!document.getElementById('nt-descartar').hidden) seguirEditando(); else cerrarNuevo();
});

function erroresForm(){
  var dur = durDe(F.tx), ok = F.tx && libres(F.d, dur).indexOf(F.hora) >= 0;
  return {
    cliente: !F.cliente && 'Elegí una clienta o agregala como nueva.',
    tel: F.cliente && F.cliente.nueva && F.wa && F.tel.replace(/\D/g, '').length < 8 && 'Agregá un teléfono para mandarle la confirmación.',
    tx: !F.tx && 'Elegí un tratamiento.',
    hora: F.tx && !ok && 'Elegí un horario libre.',
    ok: !!(F.cliente && F.tx && ok)
  };
}
function seccion(label, cuerpo, error, derecha){
  return '<div class="fs"><div class="fs-h"><span class="over">' + label + '</span>' + (derecha || '') + '</div>' + cuerpo +
    (F.intentado && error ? '<p class="fs-err"><i class="dot"></i>' + error + '</p>' : '') + '</div>';
}

function pintarForm(){
  var foco = document.activeElement && document.activeElement.id; // al repintar no se pierde dónde estabas
  var err = erroresForm(), dur = durDe(F.tx), slots = F.tx ? libres(F.d, dur) : [], hora = slots.indexOf(F.hora) >= 0 ? F.hora : '';
  var c = F.cliente, cuerpo;
  if (c) {
    var semana = TURNOS.filter(function(t){ return t.c === c.nombre && !fue(t); }).length;
    cuerpo = '<div class="cli"><div><span class="av' + (c.nueva ? ' nueva' : '') + '">' + iniciales(c.nombre) + '</span><span><b>' + esc(c.nombre) + '</b><small>' +
      (c.nueva ? 'Nueva clienta' : semana ? semana + (semana === 1 ? ' turno' : ' turnos') + ' esta semana' : 'Clienta existente') + '</small></span></div>' +
      (c.nueva ? '<input class="field" id="nt-tel" name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej.: 351 555 0101…" aria-label="Teléfono (WhatsApp)" value="' + esc(F.tel) + '" oninput="F.tel=this.value;pintarPie()">' : '') + '</div>';
  } else {
    cuerpo = '<input class="field" id="nt-q" name="clienta" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar por nombre…" aria-label="Buscar clienta" value="' + esc(F.q) + '" oninput="F.q=this.value;pintarResultados()"><div id="nt-res"></div>';
  }
  var html = seccion('Clienta', cuerpo, err.cliente || err.tel, c ? '<button class="link" onclick="F.cliente=null;F.q=\'\';pintarForm();document.getElementById(\'nt-q\').focus()">Cambiar</button>' : '');

  html += seccion('Tratamiento', '<span class="desplegable"><select class="field" id="nt-tx" aria-label="Tratamiento" onchange="F.tx=this.value;pintarForm()">' +
    '<option value="" disabled' + (F.tx ? '' : ' selected') + '>Elegí un tratamiento</option>' +
    TRATAMIENTOS.map(function(t){ return '<option' + (t[0] === F.tx ? ' selected' : '') + '>' + t[0] + '</option>'; }).join('') + '</select></span>' +
    (F.tx ? '<small class="muted" style="font-size:14.5px">' + dur + ' min</small>' : ''), err.tx);

  var dias = '';
  for (var d = HOY_D; d < DIAS.length; d++) {
    var n = F.tx ? libres(d, dur).length : null, cerradoTodo = d === SABADO;
    dias += '<button class="chip' + (F.d === d ? ' on' : '') + '" id="nt-d' + d + '" aria-pressed="' + (F.d === d) + '"' + (cerradoTodo ? ' disabled' : '') + ' onclick="F.d=' + d + ';pintarForm()">' + diaCorto(d) +
      '<small>' + (cerradoTodo ? 'Cerrado' : n == null ? '&nbsp;' : n ? n + ' libres' : 'Completo') + '</small></button>';
  }
  var horas = !F.tx ? '<p class="nt-vacio">Elegí un tratamiento para ver los horarios libres.</p>'
    : !slots.length ? '<p class="nt-vacio">No hay horarios libres ese día. Probá otro día.</p>'
    : '<div class="chips horas">' + slots.map(function(s){ return '<button class="chip' + (s === hora ? ' on' : '') + '" id="nt-h' + s.replace(':', '') + '" aria-pressed="' + (s === hora) + '" onclick="F.hora=\'' + s + '\';pintarForm()">' + s + '</button>'; }).join('') + '</div>';
  html += seccion('Día y horario', '<div class="chips">' + dias + '</div>' + horas, err.hora,
    hora ? '<b class="rango">' + hora + ' – ' + hhmm(minutos(hora) + dur) + '</b>' : '');

  html += seccion('Confirmación', '<label class="check"><input type="checkbox" id="nt-wa"' + (F.wa ? ' checked' : '') + ' onchange="F.wa=this.checked;pintarForm()">' +
    '<span><b>Preparar confirmación por WhatsApp</b><small>Queda como borrador en Mensajes: lo revisás y lo aprobás antes de que salga.</small></span></label>');
  html += seccion('Notas internas', '<textarea class="field" id="nt-notas" rows="3" placeholder="Opcional. Solo lo ve el equipo." aria-label="Notas internas" oninput="F.notas=this.value">' + esc(F.notas) + '</textarea>');

  document.getElementById('nt-body').innerHTML = html;
  if (!c) pintarResultados();
  pintarPie();
  var el = foco && document.getElementById(foco); if (el) el.focus();
}

// Coincidencias de la búsqueda (hasta 5, sin acentos ni mayúsculas) + "Agregar como nueva". Solo clientas con ficha.
var NT_RES = [];
function pintarResultados(){
  var q = F.q.trim().replace(/\s+/g, ' '), box = document.getElementById('nt-res');
  document.getElementById('nt-q').classList.toggle('abierto', !!q);
  if (!q) { box.innerHTML = ''; return; }
  NT_RES = CLIENTAS.map(function(c){ return c.nombre; }).filter(function(n){ return sinAcentos(n).indexOf(sinAcentos(q)) >= 0; }).slice(0, 5);
  var exacta = CLIENTAS.some(function(c){ return sinAcentos(c.nombre) === sinAcentos(q); });
  box.innerHTML = '<div class="res">' + NT_RES.map(function(n, j){ return '<button onclick="F.cliente={nombre:NT_RES[' + j + ']};pintarForm()">' + n + '</button>'; }).join('') +
    (exacta ? '' : '<button class="add" onclick="agregarClienta()">+ Agregar “' + esc(q) + '” como nueva clienta</button>') + '</div>';
}
// El nombre se usa en botones y en el HTML de varias pantallas: sin comillas ni < > &.
function agregarClienta(){
  var nombre = F.q.replace(/[<>&"'\\]/g, '').trim().replace(/\s+/g, ' ');
  if (!nombre) return;
  F.cliente = {nombre:nombre, nueva:true};
  pintarForm();
  document.getElementById('nt-tel').focus();
}

function pintarPie(){
  var err = erroresForm(), dur = durDe(F.tx);
  document.getElementById('nt-resumen').innerHTML = err.ok
    ? '<strong>' + esc(F.cliente.nombre) + '</strong> · ' + F.tx + ' · ' + diaCorto(F.d) + ' ' + F.hora + '–' + hhmm(minutos(F.hora) + dur)
    : 'Completá clienta, tratamiento y horario.';
  document.getElementById('nt-resumen').classList.toggle('listo', err.ok);
  document.getElementById('nt-ok').textContent = F.wa ? 'Agendar y preparar confirmación' : 'Agendar turno';
}

// Mensaje de reserva: fecha, hora, tratamiento y las indicaciones de "días antes" (las sirve el servidor
// desde generadores.mjs). Si no hay servidor, sale sin indicaciones.
var INDICACIONES = null;
fetch('/api/indicaciones').then(function(r){ return r.ok ? r.json() : null; }).then(function(x){ INDICACIONES = x; }).catch(function(){});
function mensajeReserva(t){
  var tx = t.tx.toLowerCase(), antes = INDICACIONES && INDICACIONES[tx] && INDICACIONES[tx].antes;
  return 'Hola ' + t.c.split(' ')[0] + '! Te reservamos el ' + DIAS[t.d].largo + ' a las ' + t.ini + ' para ' + tx + '.' +
    (antes ? ' Hasta entonces: ' + antes + '.' : '') + ' Nos confirmás si te queda bien? Saludos!';
}

function agendar(){
  var err = erroresForm();
  if (!err.ok || err.tel) {
    F.intentado = true; pintarForm();
    var hora = document.querySelector('#nt-body .chips.horas .chip');
    var id = err.cliente ? 'nt-q' : err.tel ? 'nt-tel' : err.tx ? 'nt-tx' : hora ? hora.id : 'nt-d' + F.d;
    document.getElementById(id).focus();
    return;
  }
  var nombre = F.cliente.nombre, dur = durDe(F.tx);
  var t = {d:F.d, ini:F.hora, fin:hhmm(minutos(F.hora) + dur), c:nombre, tx:F.tx, estado:'pend',
           rec: F.wa ? 'Confirmación en borrador · falta aprobarla' : 'Todavía no enviado', notas:F.notas.trim(), reserva:F.wa};
  TURNOS.push(t);
  // Ficha: la clienta nueva se suma a Clientes; a una existente sin turno se le anota este como próximo.
  var c = clientaDe(nombre), nuevaFicha = !c, proxAntes = c && c.prox;
  if (!c) { c = {nombre:nombre, tel:F.tel.trim(), desde:'septiembre 2026', ultima:'Todavía no vino', prox:null}; CLIENTAS.push(c); }
  if (!c.prox) c.prox = {tx:F.tx, estado:'pend'};
  // Confirmación por WhatsApp: borrador en Mensajes. No sale hasta que recepción lo aprueba.
  var conv = null, convNueva = false, convAntes = null;
  if (F.wa) {
    var k = convDe(nombre);
    if (k < 0) { CONVERSACIONES.push({nombre:nombre, hora:AHORA, mensajes:[]}); k = CONVERSACIONES.length - 1; convNueva = true; }
    conv = CONVERSACIONES[k];
    convAntes = {cierre:conv.cierre, borrador:conv.borrador, resumen:conv.resumen, tipo:conv.tipo, turno:conv.turno, hora:conv.hora};
    conv.cierre = 'borrador'; conv.tipo = 'reserva'; conv.turno = t; conv.hora = AHORA;
    conv.resumen = 'Confirmación lista para revisar'; conv.borrador = mensajeReserva(t);
  }
  cerrarNuevo(true);
  refrescar();
  avisarConDeshacer('Turno agendado: ' + nombre + ' · ' + diaCorto(t.d) + ', ' + t.ini, function(){
    var j = TURNOS.indexOf(t);
    if (j >= 0) { TURNOS.splice(j, 1); if (turnoSel === j) turnoSel = proximo() != null ? proximo() : 0; else if (turnoSel > j) turnoSel--; }
    if (nuevaFicha) CLIENTAS.splice(CLIENTAS.indexOf(c), 1); else c.prox = proxAntes;
    if (convNueva) CONVERSACIONES.splice(CONVERSACIONES.indexOf(conv), 1);
    else if (conv) Object.keys(convAntes).forEach(function(key){ conv[key] = convAntes[key]; });
    refrescar();
  });
}

// Repinta lo que esté a la vista después de crear, mover o deshacer.
function refrescar(){
  elegirTurno(turnoSel);
  if (!document.getElementById('vista-semana').hidden) pintarSemana();
  if (!document.getElementById('pantalla-inicio').hidden) pintarInicio();
  if (!document.getElementById('pantalla-clientes').hidden) pintarListaClientas();
  pintarListaMensajes(-1);
}

// Click en un espacio libre: abre Nuevo turno con día y hora (redondeada a la media hora). No en días pasados ni cerrados.
function nuevoEn(e, col){
  var d = +col.dataset.d;
  if (e.target !== col || d < HOY_D) return;
  var m = Math.min(WK0 + Math.floor((e.clientY - col.getBoundingClientRect().top) / WPX / 30) * 30, WK1 - 30);
  if (cerrado(d, m, m + 30)) return;
  abrirNuevo({d:d, hora:hhmm(m)});
}

function elegirTurno(i){
  turnoSel = i;
  var t = TURNOS[i], c = clientaDe(t.c), k = convDe(t.c);
  var principal = '';
  if (t.reserva && k >= 0) principal = '<button class="pill solid" style="width:100%" onclick="ir(\'mensajes\');elegirConversacion(' + k + ')">Revisar confirmación</button>';
  else if (c && t.estado === 'pend' && !t.enviado) principal = '<button class="pill solid" style="width:100%" onclick="prepararRecordatorio(' + i + ')">Preparar recordatorio</button>';
  else if (k >= 0) principal = '<button class="pill solid" style="width:100%" onclick="ir(\'mensajes\');elegirConversacion(' + k + ')">Ver conversación</button>';
  document.getElementById('detalle').innerHTML =
    '<p class="eyebrow">Turno seleccionado</p>' +
    '<h2>' + t.c + '</h2>' +
    '<p class="when">' + (t.d === HOY_D ? '' : DIAS[t.d].largo + ' · ') + t.ini + ' – ' + t.fin + ' · ' + duracion(t) + '</p>' +
    pillEstado(estadoHoy(t)) +
    '<p class="eyebrow" style="margin-top:18px">Tratamientos</p>' +
    '<ul>' + t.tx.split(' + ').map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>' +
    '<dl>' + (c ? '<dt>WhatsApp</dt><dd>' + c.tel + '</dd>' : '') +
    '<dt>Recordatorio</dt><dd>' + (t.rec || 'Todavía no enviado') + '</dd>' +
    (t.notas ? '<dt>Notas</dt><dd>' + esc(t.notas) + '</dd>' : '') + '</dl>' +
    principal +
    (c ? '<button class="pill" style="width:100%;margin-top:8px" onclick="verFicha(\'' + t.c + '\')">Ver ficha</button>' : '');
  pintarDia();
}
// Desde un click: en pantallas angostas el detalle queda abajo de la lista, así que se lo trae a la vista.
function verTurno(i){ elegirTurno(i); document.getElementById('detalle').scrollIntoView({block:'nearest', behavior:'smooth'}); }

function verEnAgenda(nombre){ ir('agenda'); ver('dia'); var i = turnoDe(nombre); if (i >= 0) elegirTurno(i); }
function verFicha(nombre){ ir('clientes'); elegirClienta(CLIENTAS.indexOf(clientaDe(nombre))); }
// Avisos de "no puedo ir": los responde recepción por WhatsApp, desde el chat de la clienta.
function responder(nombre){
  ir('mensajes'); elegirConversacion(convDe(nombre));
  var ta = document.getElementById('respuesta'); if (ta) ta.focus();
}
function enviarRespuesta(k){
  var conv = CONVERSACIONES[k], texto = document.getElementById('respuesta').value.trim();
  if (!texto) { aviso('Escribí el mensaje antes de enviar.'); return; }
  conv.mensajes.push({de:'out', texto:texto, hora:'Okio · 15:21'});
  conv.cierre = 'respondido'; conv.resumen = 'Respondido · esperando que elija otro horario';
  elegirConversacion(k);
}

function filtrarClientas(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('#lista-clientas .row').forEach(function(r, j){
    r.hidden = !!q && (CLIENTAS[j].nombre + ' ' + CLIENTAS[j].tel).toLowerCase().indexOf(q) < 0;
  });
}

var avisoTimer;
function aviso(texto){
  var el = document.getElementById('aviso');
  el.textContent = texto; el.hidden = false;
  clearTimeout(avisoTimer); avisoTimer = setTimeout(function(){ el.hidden = true; }, 3500);
}

// Recordatorio: lo redacta la IA real (ai-triage/server.mjs → /api/recordatorio).
// Si no hay servidor, falta la key o tarda más de 15 s, queda un borrador de ejemplo y la demo sigue.
async function prepararRecordatorio(i){
  if (i == null) i = turnoSel;
  var t = TURNOS[i], nombre = t.c.split(' ')[0], k = convDe(t.c), dia = diaLargo(t.d);
  var tratamiento = t.tx.toLowerCase().replace(' + ', ' y ');
  if (k < 0) {
    CONVERSACIONES.push({nombre:t.c, hora:'15:21', mensajes:[]});
    k = CONVERSACIONES.length - 1;
  }
  var conv = CONVERSACIONES[k];
  conv.cierre = 'borrador'; conv.resumen = 'Borrador listo para revisar'; conv.tipo = null; conv.turno = null;
  conv.borrador = conv.borrador || ('Hola ' + nombre + '! Te recordamos tu turno de ' + dia + ', a las ' + t.ini +
    ' para ' + tratamiento + '. Nos confirmás si venís? Saludos!');
  ir('mensajes'); elegirConversacion(k);
  var ta = document.getElementById('borrador'), label = document.getElementById('borrador-label'), btn = document.getElementById('btn-aprobar');
  ta.value = 'Redactando con IA…'; ta.disabled = true; btn.disabled = true;
  try {
    var r = await fetch('/api/recordatorio', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      signal: AbortSignal.timeout(15000),
      body: JSON.stringify({turnos: [{nombre: nombre, tratamiento: tratamiento, dia: dia, hora: t.ini}]})
    });
    var data = await r.json();
    if (!r.ok) throw new Error(data.error);
    conv.borrador = data.items[0].mensaje;
    label.textContent = 'Borrador redactado por la IA · Revisalo antes de enviar';
  } catch (e) {
    console.warn('Sin IA, queda el borrador de ejemplo:', e);
    label.textContent = 'Borrador de ejemplo · Revisalo antes de enviar';
  }
  ta.value = conv.borrador; ta.disabled = false; btn.disabled = false;
}

function aprobar(k){
  var conv = CONVERSACIONES[k], t = conv.turno || TURNOS[turnoDe(conv.nombre)], reserva = conv.tipo === 'reserva';
  conv.mensajes.push({dia:'Hoy'}, {de:'out', texto: document.getElementById('borrador').value, hora:'Okio · 15:21'});
  conv.cierre = 'enviado'; conv.resumen = (reserva ? 'Confirmación enviada' : 'Recordatorio enviado') + ' · esperando respuesta';
  elegirConversacion(k);
  if (t) { t.enviado = true; t.reserva = false; t.rec = 'Enviado hoy 15:21 · esperando respuesta'; }
  elegirTurno(turnoSel);
}

// Inicio (V3 Editorial): los turnos de hoy y lo que hay que resolver. Lee los mismos datos que Agenda y Mensajes.
function espera(hora){
  if (!/^\d\d:\d\d$/.test(hora)) return hora;
  var m = minutos(AHORA) - minutos(hora);
  return m < 1 ? 'recién' : 'hace ' + m + ' min';
}
function pintarInicio(){
  var hoy = deHoy(), sig = proximo();
  var convs = CONVERSACIONES.map(function(c, k){ return {c:c, k:k}; })
    .filter(function(x){ return x.c.cierre === 'humano' || x.c.cierre === 'borrador'; });
  var seguir = CLIENTAS.filter(function(c){ return !c.prox; });
  var pend = hoy.filter(function(i){ var s = estadoHoy(TURNOS[i]); return s === 'alert' || s === 'pend' || s === 'sent'; }).length;
  var metricas = [[hoy.length, 'Turnos de hoy'], [pend, 'Pendientes'], [convs.length, 'Conversaciones por resolver']];

  var turnos = hoy.map(function(i){
    var t = TURNOS[i], s = estadoHoy(t), marca = s === 'alert' || s === 'pend' || s === 'sent', sigue = i === sig && !marca;
    return '<button class="h-row' + (s === 'done' ? ' fue' : '') + '" onclick="verEnAgenda(\'' + t.c + '\')">' +
      '<time>' + t.ini + '</time>' +
      '<span class="who"><span><b>' + t.c + '</b> — ' + t.tx + '</span><small>' + duracion(t) + '</small></span>' +
      '<span class="st' + (marca ? ' flag' : sigue ? ' sigue' : '') + '">' + (marca ? '<i class="dot"></i>' : '') + (sigue ? 'Sigue' : textoEstado(s)) + '</span></button>';
  }).join('');

  var conversaciones = convs.length ? convs.map(function(x){
    var c = x.c, borrador = c.cierre === 'borrador', ultimo = c.mensajes[c.mensajes.length - 1];
    return '<div class="r-item"><div><span class="canal">WhatsApp</span><b>' + c.nombre + '</b><time>' + espera(c.hora) + '</time></div>' +
      (borrador ? '<p style="margin:0;font-size:15.5px">' + (c.tipo === 'reserva' ? 'La confirmación del turno nuevo está lista' : 'El borrador del recordatorio está listo') + ' para revisar.</p>' : '<q>' + esc(ultimo.texto) + '</q>') +
      (borrador ? '<button class="btn" onclick="ir(\'mensajes\');elegirConversacion(' + x.k + ')">' + (c.tipo === 'reserva' ? 'Revisar confirmación' : 'Revisar borrador') + '</button>'
                : '<button class="btn" onclick="responder(\'' + c.nombre + '\')">Responder</button>') + '</div>';
  }).join('') : '<p class="r-empty">No hay mensajes sin responder.</p>';

  var seguimientos = seguir.length ? seguir.map(function(c){
    return '<div class="r-item r-fu"><span><b>' + c.nombre + '</b><small>Sin turno reservado · última visita ' + c.ultima.charAt(0).toLowerCase() + c.ultima.slice(1) + '</small></span>' +
      '<button class="btn" onclick="verFicha(\'' + c.nombre + '\')">Contactar</button></div>';
  }).join('') : '<p class="r-empty">Nadie para contactar por ahora.</p>';

  document.getElementById('home').innerHTML =
    '<div class="home-head"><div><h1 class="hoy">Hoy</h1><p class="fecha">jueves 17 de septiembre</p>' +
      '<p class="bajada">Tus turnos y conversaciones, en un solo lugar.</p></div>' +
      '<button class="btn primary" onclick="nuevoTurno()">+ Nuevo turno</button></div>' +
    '<div class="metrics">' + metricas.map(function(m){ return '<div><b>' + m[0] + '</b><span>' + m[1] + '</span></div>'; }).join('') + '</div>' +
    '<div class="home-cols">' +
      '<section aria-label="Turnos de hoy"><div class="sec-head"><h2>Turnos</h2><small>' + hoy.length + ' hoy</small>' +
        '<button class="link" onclick="ir(\'agenda\');ver(\'dia\')">Ver agenda →</button></div>' + turnos + '</section>' +
      '<section class="resolver" aria-label="Para resolver ahora"><h2><i class="dot"></i>Para resolver ahora</h2>' +
        '<div class="r-sub"><span class="over">Conversaciones</span><button class="link" onclick="ir(\'mensajes\')">Ver todas →</button></div>' + conversaciones +
        '<div class="r-sub" style="padding-top:14px"><span class="over">Seguimientos</span><button class="link" onclick="ir(\'clientes\')">Ver clientas →</button></div>' + seguimientos +
      '</section>' +
    '</div>';
}

function ir(p){
  ['inicio','agenda','clientes','mensajes'].forEach(function(x){
    document.getElementById('pantalla-' + x).hidden = x !== p;
    document.getElementById('nav-' + x).classList.toggle('on', x === p);
    if (x === p) document.getElementById('nav-' + x).setAttribute('aria-current', 'page');
    else document.getElementById('nav-' + x).removeAttribute('aria-current');
  });
  if (p === 'inicio') pintarInicio();
  if (p === 'clientes') { pintarListaClientas(); filtrarClientas(document.getElementById('buscar').value); }
  urlVista();
}

// La vista de Agenda queda en la URL (?view=day|week): se puede recargar o compartir el link y abre igual.
var vista = 'dia';
function urlVista(){
  // En el visor de la maqueta publicada cambiar la URL puede estar bloqueado: la página sigue igual.
  try { history.replaceState(null, '', document.getElementById('pantalla-agenda').hidden ? location.pathname : '?view=' + (vista === 'dia' ? 'day' : 'week')); } catch (e) {}
}
function ver(v){
  var dia = v === 'dia';
  vista = v;
  document.getElementById('vista-dia').hidden = !dia;
  document.getElementById('vista-semana').hidden = dia;
  document.getElementById('btn-turno').hidden = dia; // en Día, el botón está en el resumen
  document.getElementById('bajada').hidden = dia;
  document.getElementById('btn-dia').classList.toggle('on', dia); document.getElementById('btn-dia').setAttribute('aria-pressed', dia);
  document.getElementById('btn-semana').classList.toggle('on', !dia); document.getElementById('btn-semana').setAttribute('aria-pressed', !dia);
  document.getElementById('eyebrow').textContent = dia ? 'Agenda · Día' : 'Agenda · Semana';
  document.getElementById('titulo').textContent = dia ? 'Agenda' : 'Semana del 14 de septiembre';
  urlVista();
  if (dia) return;
  pintarSemana();
  var cal = document.getElementById('cal-semana');
  cal.scrollTop = Math.max(0, yS(minutos(AHORA)) - 200); // arranca mostrando la hora actual
}

pintarListaClientas();
elegirClienta(3); // Luciana, la del recorrido de la demo
pintarListaMensajes(-1);
elegirConversacion(1); // Luciana, la del recorrido de la demo
elegirTurno(turnoSel);
var pedida = new URLSearchParams(location.search).get('view');
ver(pedida === 'week' ? 'semana' : 'dia');
ir(pedida ? 'agenda' : 'inicio');
</script>
