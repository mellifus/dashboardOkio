<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Okio — Recordatorios</title>
    <style>
      :root { --bg: #f3ece6; --card: #fff; --ink: #4a3f38; --accent: #b07a53; --line: #e4d8ce; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
             background: var(--bg); color: var(--ink); line-height: 1.5; }
      main { max-width: 560px; margin: 0 auto; padding: 28px 18px 48px; }
      h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; }
      p.sub { margin: 0 0 22px; color: #8a7a6d; font-size: 13.5px; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 5px; }
      select, input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line);
                      border-radius: 8px; background: var(--card); color: var(--ink); }
      button { margin-top: 20px; width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
               border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 22px; }
      .eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #a08a7a; }
      .antes { color: #9a8b7e; font-size: 13.5px; margin: 6px 0 0; }
      .msg { font-size: 15px; margin: 6px 0 12px; white-space: pre-wrap; }
      .copiar { width: auto; margin: 0; padding: 7px 14px; font-size: 13px; background: #fff; color: var(--accent); border: 1px solid var(--accent); }
      .error { color: #b4453a; font-size: 14px; margin-top: 18px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recordatorios Okio</h1>
      <p class="sub">Elegí el tratamiento y la hora. La IA redacta el borrador — vos lo revisás y lo copiás a WhatsApp. Nada se envía solo.</p>

      <label for="trat">Tratamiento</label>
      <select id="trat">
        <option>peeling facial</option>
        <option>peeling corporal</option>
        <option>depilación definitiva</option>
        <option>consulta con la Dra. Calvo</option>
        <option value="__otro">Otro…</option>
      </select>
      <input id="tratOtro" placeholder="Escribí el tratamiento" hidden />

      <label for="hora">Hora</label>
      <input id="hora" placeholder="16:00" value="16:00" />

      <button id="generar">Generar borrador</button>

      <p id="error" class="error" hidden></p>

      <div id="resultado" class="card" hidden>
        <div class="eyebrow">Antes (lo que llega hoy)</div>
        <p class="antes" id="antes"></p>
        <div class="eyebrow" style="margin-top:14px">Borrador sugerido</div>
        <p class="msg" id="msg"></p>
        <button class="copiar" id="copiar">Copiar</button>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const trat = $("trat"), tratOtro = $("tratOtro");

      trat.onchange = () => { tratOtro.hidden = trat.value !== "__otro"; };

      $("generar").onclick = async () => {
        const tratamiento = trat.value === "__otro" ? tratOtro.value.trim() : trat.value;
        const hora = $("hora").value.trim();
        if (!tratamiento || !hora) { mostrarError("Completá tratamiento y hora."); return; }

        setLoading(true);
        try {
          const r = await fetch("/api/recordatorio", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ turnos: [{ tratamiento, hora }] }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Algo salió mal.");
          const item = data.items[0];
          $("antes").textContent = item.antes;
          $("msg").textContent = item.mensaje;
          $("resultado").hidden = false;
          $("error").hidden = true;
        } catch (e) {
          mostrarError(e.message);
        } finally {
          setLoading(false);
        }
      };

      $("copiar").onclick = async () => {
        try { await navigator.clipboard.writeText($("msg").textContent); $("copiar").textContent = "Copiado ✓"; }
        catch { $("copiar").textContent = "Copiá a mano"; }
        setTimeout(() => ($("copiar").textContent = "Copiar"), 1500);
      };

      function setLoading(on) {
        $("generar").disabled = on;
        $("generar").textContent = on ? "Generando…" : "Generar borrador";
      }
      function mostrarError(m) { $("error").textContent = m; $("error").hidden = false; $("resultado").hidden = true; }
    </script>
  </body>
</html>
